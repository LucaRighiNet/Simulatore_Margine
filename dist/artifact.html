<script>
'use strict';

// ---- calcolo.mjs ----
// Motore di calcolo del simulatore di margine di commessa.
// Modulo puro: nessun accesso al DOM, nessuno stato globale, nessuna dipendenza.
// È il punto del sistema dove un errore costa di più, quindi vive separato ed è testato.

const COLONNE = ['preventivo', 'kom', 'simulato'];
const CATEGORIE = ['materiale', 'manodopera', 'altri'];

const ETICHETTA_COLONNA = {
  preventivo: 'Preventivo',
  kom: 'KOM',
  simulato: 'Simulato',
};

const ETICHETTA_CATEGORIA = {
  materiale: 'Materiale',
  manodopera: 'Manodopera',
  altri: 'Altri costi diretti',
};

const num = (v) => {
  const n = typeof v === 'number' ? v : parseFloat(String(v ?? '').replace(',', '.'));
  return Number.isFinite(n) ? n : 0;
};

// Le percentuali sono memorizzate come numeri leggibili (8 significa 8%).
// Internamente si lavora in frazioni.
const frazione = (v) => num(v) / 100;

/** Costo di una singola voce nella colonna indicata, prima degli scostamenti. */
function costoVoce(voce, colonna, tariffe) {
  const d = voce[colonna] || {};
  if (voce.cat === 'manodopera') {
    const t = (tariffe || []).find((x) => x.id === voce.tariffaId);
    return num(d.q) * num(t && t.eurOra);
  }
  return num(d.q) * (1 - frazione(d.sconto));
}

/** Fattore moltiplicativo degli scostamenti applicabili a una voce. */
function fattoreVoce(sim, linea, voce) {
  const d = sim.delta || {};
  return (
    (1 + frazione(d.globale)) *
    (1 + frazione((d.linea || {})[linea.id])) *
    (1 + frazione((d.catLinea || {})[linea.id + '|' + voce.cat])) *
    (1 + frazione((d.voce || {})[voce.id]))
  );
}

/**
 * Su quale colonna poggia la simulazione. Normalmente il KOM, che è il budget di cui il PM
 * risponde. Se il KOM non è ancora stato compilato la simulazione poggia sul preventivo:
 * senza questo ripiego, chi compila solo il preventivo muove i cursori e non vede nulla,
 * perché moltiplicare zero per qualunque scostamento dà zero.
 */
function baseSimulato(sim) {
  const haKom = (sim.linee || []).some((l) => (
    num((l.ricavo || {}).kom) !== 0
    || (l.voci || []).some((v) => num((v.kom || {}).q) !== 0)
  ));
  return haKom ? 'kom' : 'preventivo';
}

/** Costo di una voce nella colonna simulato: colonna base moltiplicata per gli scostamenti. */
function costoVoceSimulato(sim, linea, voce, base) {
  return costoVoce(voce, base || baseSimulato(sim), sim.tariffe) * fattoreVoce(sim, linea, voce);
}

function ricavoLinea(sim, linea, colonna, base) {
  if (colonna !== 'simulato') return num((linea.ricavo || {})[colonna]);
  const d = sim.delta || {};
  return (
    num((linea.ricavo || {})[base]) *
    (1 + frazione(d.ricavo)) *
    (1 + frazione((d.ricavoLinea || {})[linea.id]))
  );
}

function costoDellaVoce(sim, linea, voce, colonna, base) {
  return colonna === 'simulato'
    ? costoVoceSimulato(sim, linea, voce, base)
    : costoVoce(voce, colonna, sim.tariffe);
}

const rapporto = (a, b) => (b !== 0 ? a / b : null);

/** Calcola una colonna completa: dettaglio per linea e totali di commessa. */
function calcolaColonna(sim, colonna) {
  const base = colonna === 'simulato' ? baseSimulato(sim) : colonna;
  const p = sim.parametri || {};
  const sg = frazione(p.sgPct);
  const ctg = frazione(p.ctgPct);
  const target = frazione(p.targetPct);

  const linee = (sim.linee || []).map((linea) => {
    const perCategoria = {};
    for (const cat of CATEGORIE) perCategoria[cat] = 0;
    const voci = {};
    for (const voce of linea.voci || []) {
      const c = costoDellaVoce(sim, linea, voce, colonna, base);
      perCategoria[voce.cat] = (perCategoria[voce.cat] || 0) + c;
      voci[voce.id] = c;
    }
    const cd = CATEGORIE.reduce((s, cat) => s + perCategoria[cat], 0);
    const r = ricavoLinea(sim, linea, colonna, base);
    const mdc = r - cd;
    return {
      id: linea.id,
      nome: linea.nome,
      perCategoria,
      voci,
      cd,
      ricavo: r,
      mdc,
      mdcPct: rapporto(mdc, r),
    };
  });

  const cd = linee.reduce((s, l) => s + l.cd, 0);
  const ricavo = linee.reduce((s, l) => s + l.ricavo, 0);
  const mdc = ricavo - cd;
  const speseGenerali = cd * sg;
  const contingency = cd * ctg;
  const mi = ricavo - cd - speseGenerali - contingency;

  // Costo massimo compatibile con il margine industriale obiettivo:
  // MI = R - CD(1+sg+ctg) >= target*R  =>  CD <= R(1-target)/(1+sg+ctg)
  const cdMax = (ricavo * (1 - target)) / (1 + sg + ctg);
  const riserva = cdMax - cd;

  return {
    colonna,
    base,
    linee,
    cd,
    ricavo,
    mdc,
    mdcPct: rapporto(mdc, ricavo),
    speseGenerali,
    contingency,
    mi,
    miPct: rapporto(mi, ricavo),
    cdMax,
    riserva,
    riservaPct: rapporto(riserva, cd),
  };
}

/**
 * Confronto fra due colonne. Restituisce le tre grandezze distinte che il documento
 * di proposta impone di non confondere: variazione assoluta in euro, variazione della
 * marginalità in punti percentuali, variazione relativa del margine in percentuale.
 */
function gap(a, b) {
  const pp = (x, y) => (x === null || y === null ? null : (y - x) * 100);
  // La variazione relativa non ha significato se il margine di partenza non è positivo.
  const rel = (x, y) => (x > 0 ? ((y - x) / x) * 100 : null);

  const effettoCostoPerLinea = b.linee.map((lb) => {
    const la = a.linee.find((x) => x.id === lb.id);
    const base = la || { cd: 0, ricavo: 0, perCategoria: {} };
    const perCategoria = {};
    for (const cat of CATEGORIE) {
      perCategoria[cat] = -((lb.perCategoria[cat] || 0) - (base.perCategoria[cat] || 0));
    }
    return {
      id: lb.id,
      nome: lb.nome,
      effettoRicavo: lb.ricavo - base.ricavo,
      effettoCosto: -(lb.cd - base.cd),
      perCategoria,
      dMdc: lb.mdc - (base.mdc || 0),
    };
  });

  return {
    da: a.colonna,
    a: b.colonna,
    dMdc: b.mdc - a.mdc,
    dMdcPp: pp(a.mdcPct, b.mdcPct),
    dMdcRel: rel(a.mdc, b.mdc),
    dMi: b.mi - a.mi,
    dMiPp: pp(a.miPct, b.miPct),
    dMiRel: rel(a.mi, b.mi),
    dRicavo: b.ricavo - a.ricavo,
    dCd: b.cd - a.cd,
    effettoRicavo: b.ricavo - a.ricavo,
    effettoCosto: -(b.cd - a.cd),
    perLinea: effettoCostoPerLinea,
  };
}

/** Calcolo completo: le tre colonne e i due gap. */
function calcola(sim) {
  const colonne = {};
  for (const c of COLONNE) colonne[c] = calcolaColonna(sim, c);
  return {
    colonne,
    baseSimulazione: baseSimulato(sim),
    gapPreventivoKom: gap(colonne.preventivo, colonne.kom),
    gapKomSimulato: gap(colonne.kom, colonne.simulato),
  };
}

/**
 * Sensitività: impatto sul margine industriale simulato di una variazione del driver,
 * tenendo fermi gli altri. Ordinato per impatto decrescente (tornado).
 */
function sensitivita(sim, ampiezzaPct = 10) {
  const driver = [];
  for (const linea of sim.linee || []) {
    for (const cat of CATEGORIE) {
      const chiave = linea.id + '|' + cat;
      const haVoci = (linea.voci || []).some((v) => v.cat === cat);
      if (haVoci) driver.push({ chiave, etichetta: linea.nome + ' · ' + ETICHETTA_CATEGORIA[cat] });
    }
  }
  const partenza = calcolaColonna(sim, 'simulato').mi;
  const righe = driver.map((d) => {
    const conDelta = (segno) => {
      const clone = {
        ...sim,
        delta: {
          ...(sim.delta || {}),
          catLinea: {
            ...((sim.delta || {}).catLinea || {}),
            [d.chiave]: num(((sim.delta || {}).catLinea || {})[d.chiave]) + segno * ampiezzaPct,
          },
        },
      };
      return calcolaColonna(clone, 'simulato').mi;
    };
    const su = conDelta(1) - partenza;
    const giu = conDelta(-1) - partenza;
    return { ...d, su, giu, ampiezza: Math.abs(su - giu) };
  });
  righe.sort((x, y) => y.ampiezza - x.ampiezza);
  return { base: partenza, ampiezzaPct, righe };
}


// ---- modello.mjs ----
// Modello dati della simulazione: valori di default, voci suggerite, serializzazione.
// Separato dal motore di calcolo perché qui vivono le convenzioni aziendali, che cambiano,
// mentre le formule no.

const VERSIONE_SCHEMA = 1;

let contatore = 0;
function id(prefisso = 'x') {
  contatore += 1;
  return prefisso + '-' + Date.now().toString(36) + '-' + contatore.toString(36);
}

/** Tipi di manodopera con tariffa oraria centralizzata. Le tariffe partono vuote di proposito. */
const TARIFFE_DEFAULT = [
  'Produzione e cablaggio',
  'Ingegneria elettrica',
  'Ingegneria software',
  'Montaggio in cantiere',
  'Messa in servizio',
  'Project management',
];

/** Voci suggerite nel menu "aggiungi", per categoria. L'elenco è un aiuto, non un vincolo. */
const SUGGERIMENTI = {
  materiale: [
    'ABB', 'Siemens', 'Schneider', 'Rittal', 'Phoenix Contact', 'Weidmuller',

function nuovaVoce(cat, nome, tariffe) {
  const v = {
    id: id('v'),
    cat,
    nome,
    preventivo: { q: 0, sconto: 0 },
    kom: { q: 0, sconto: 0 },
  };
  if (cat === 'manodopera') {
    const t = (tariffe || []).find((x) => x.nome === nome);
    v.tariffaId = t ? t.id : null;
  }
  return v;
}

function nuovaTariffa(nome, eurOra = 0) {
  return { id: id('t'), nome, eurOra };
}

function nuovaLinea(nome) {
  return { id: id('l'), nome, ricavo: { preventivo: 0, kom: 0 }, voci: [] };
}

/** Nomi delle linee di servizio predefinite, per poterle reinserire dopo una cancellazione. */
function nomiLineeStandard() {
  return LINEE_DEFAULT.map((d) => d.nome);
}

/** Ricrea una linea standard completa delle sue voci di default. */
function lineaStandard(nome, tariffe) {
  const def = LINEE_DEFAULT.find((d) => d.nome === nome);
  const l = nuovaLinea(nome);
  if (def) l.voci = def.voci.map(([cat, n]) => nuovaVoce(cat, n, tariffe));
  return l;
}

function nuovaSimulazione() {
  const tariffe = TARIFFE_DEFAULT.map((n) => nuovaTariffa(n, 0));
  const linee = LINEE_DEFAULT.map((def) => {
    const l = nuovaLinea(def.nome);
    l.voci = def.voci.map(([cat, nome]) => nuovaVoce(cat, nome, tariffe));
    return l;
  });
  return {
    versione: VERSIONE_SCHEMA,
    meta: {
      codice: '',
      cliente: '',
      descrizione: '',
      data: new Date().toISOString().slice(0, 10),
      autore: '',
      note: '',
    },
    parametri: { sgPct: 0, ctgPct: 0, targetPct: 0, validitaTariffe: '' },
    tariffe,
    linee,
    delta: { ricavo: 0, ricavoLinea: {}, globale: 0, linea: {}, catLinea: {}, voce: {} },
  };
}

/** Normalizza una simulazione caricata da file, tollerando campi mancanti. */
function normalizza(raw) {
  const base = nuovaSimulazione();
  if (!raw || typeof raw !== 'object') return base;
  const sim = {
    versione: VERSIONE_SCHEMA,
    meta: { ...base.meta, ...(raw.meta || {}) },
    parametri: { ...base.parametri, ...(raw.parametri || {}) },
    tariffe: Array.isArray(raw.tariffe) && raw.tariffe.length ? raw.tariffe : base.tariffe,
    linee: Array.isArray(raw.linee) ? raw.linee : base.linee,
    delta: { ...base.delta, ...(raw.delta || {}) },
  };
  sim.linee = sim.linee.map((l) => ({
    id: l.id || id('l'),
    nome: l.nome || 'Linea',
    ricavo: { preventivo: 0, kom: 0, ...(l.ricavo || {}) },
    voci: (l.voci || []).map((v) => ({
      id: v.id || id('v'),
      cat: v.cat || 'materiale',
      nome: v.nome || 'Voce',
      tariffaId: v.tariffaId ?? null,
      preventivo: { q: 0, sconto: 0, ...(v.preventivo || {}) },
      kom: { q: 0, sconto: 0, ...(v.kom || {}) },
    })),
  }));
  return sim;
}

/** Nome file dell'archivio: leggibile, ordinabile, senza caratteri problematici. */
function nomeFile(sim) {
  const pulisci = (s) => String(s || '').trim().replace(/[^\w\s-]/g, '').replace(/\s+/g, '-').slice(0, 40);
  const codice = pulisci(sim.meta.codice) || 'senza-codice';
  const d = new Date();
  const p = (n) => String(n).padStart(2, '0');
  const stamp = `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}`;
  return `${codice}_${stamp}.json`;
}

// ---- archivio.mjs ----
// Persistenza dell'archivio delle simulazioni.
//
// Tre livelli, in ordine di robustezza:
//   1. cartella di rete scelta dall'utente (File System Access API, Chrome ed Edge)
//   2. memoria del browser, come ripiego dichiarato all'utente
//   3. file singolo scaricato o aperto a mano, sempre disponibile
//
// La memoria del browser non è un archivio: è agganciata al browser e al percorso della
// pagina, e sparisce con la pulizia dei dati di navigazione. L'interfaccia lo dice.


const CHIAVE_ARCHIVIO = 'sm.archivio.v1';
const CHIAVE_BOZZA = 'sm.bozza.v1';
const DB = 'simulatore-margine';
const STORE = 'handle';

function supportaCartella() {
  return typeof globalThis.showDirectoryPicker === 'function';
}

/** I download partono solo se la pagina non è in un contenitore che li blocca. */
function supportaDownload() {
  try {
    const a = document.createElement('a');
    return typeof a.download === 'string' && typeof URL.createObjectURL === 'function';
  } catch { return false; }
}

function conMemoria(fn, ripiego = null) {
  try { return fn(); } catch { return ripiego; }
}

// --- memoria del browser -----------------------------------------------------------

function leggiMappa() {
  return conMemoria(() => JSON.parse(localStorage.getItem(CHIAVE_ARCHIVIO) || '{}'), {}) || {};
}
function scriviMappa(m) {
  return conMemoria(() => { localStorage.setItem(CHIAVE_ARCHIVIO, JSON.stringify(m)); return true; }, false);
}

function salvaBozza(sim) {
  conMemoria(() => localStorage.setItem(CHIAVE_BOZZA, JSON.stringify(sim)));
}
function leggiBozza() {
  const raw = conMemoria(() => localStorage.getItem(CHIAVE_BOZZA), null);
  if (!raw) return null;
  try { return normalizza(JSON.parse(raw)); } catch { return null; }
}
function scartaBozza() {
  conMemoria(() => localStorage.removeItem(CHIAVE_BOZZA));
}

// --- cartella ----------------------------------------------------------------------

function apriDb() {
  return new Promise((ris, rif) => {
    const r = indexedDB.open(DB, 1);
    r.onupgradeneeded = () => r.result.createObjectStore(STORE);
    r.onsuccess = () => ris(r.result);
    r.onerror = () => rif(r.error);
  });
}

async function scriviHandle(h) {
  const db = await apriDb();
  return new Promise((ris, rif) => {
    const tx = db.transaction(STORE, 'readwrite');
    tx.objectStore(STORE).put(h, 'cartella');
    tx.oncomplete = () => ris(true);
    tx.onerror = () => rif(tx.error);
  });
}

async function leggiHandle() {
  const db = await apriDb();
  return new Promise((ris) => {
    const tx = db.transaction(STORE, 'readonly');
    const r = tx.objectStore(STORE).get('cartella');
    r.onsuccess = () => ris(r.result || null);
    r.onerror = () => ris(null);
  });
}

let cartella = null;

function cartellaAttiva() { return cartella; }

/** Ricollega la cartella già scelta, se il permesso è ancora concesso senza chiedere nulla. */
async function ripristinaCartella() {
  if (!supportaCartella()) return null;
  const h = await conMemoria(() => leggiHandle(), null);
  if (!h) return null;
  try {
    const stato = await h.queryPermission({ mode: 'readwrite' });
    if (stato === 'granted') { cartella = h; return h; }
  } catch { /* handle non più valido */ }
  return null;
}

async function scegliCartella() {
  const h = await globalThis.showDirectoryPicker({ mode: 'readwrite', id: 'archivio-margine' });
  const stato = await h.requestPermission({ mode: 'readwrite' });
  if (stato !== 'granted') throw new Error('Permesso di scrittura non concesso sulla cartella.');
  cartella = h;
  await conMemoria(() => scriviHandle(h));
  return h;
}

function staccaCartella() { cartella = null; }

// --- API unica dell'archivio -------------------------------------------------------

function modo() { return cartella ? 'cartella' : 'browser'; }

function sintesi(nome, sim) {
  return {
    nome,
    codice: sim.meta?.codice || '(senza codice)',
    cliente: sim.meta?.cliente || '',
    data: sim.meta?.data || '',
    descrizione: sim.meta?.descrizione || '',
    sim,
  };
}

async function elenca() {
  if (cartella) {
    const voci = [];
    for await (const [nome, h] of cartella.entries()) {
      if (!nome.toLowerCase().endsWith('.json') || h.kind !== 'file') continue;
      try {
        const testo = await (await h.getFile()).text();
        voci.push(sintesi(nome, normalizza(JSON.parse(testo))));
      } catch { /* file non leggibile: si ignora senza interrompere l'elenco */ }
    }
    return voci.sort((a, b) => b.nome.localeCompare(a.nome));
  }
  const m = leggiMappa();
  return Object.entries(m)
    .map(([nome, sim]) => sintesi(nome, normalizza(sim)))
    .sort((a, b) => b.nome.localeCompare(a.nome));
}

async function salva(sim) {
  const nome = nomeFile(sim);
  const testo = JSON.stringify(sim, null, 2);
  if (cartella) {
    const h = await cartella.getFileHandle(nome, { create: true });
    const w = await h.createWritable();
    await w.write(testo);
    await w.close();
    return { nome, modo: 'cartella' };
  }
  const m = leggiMappa();
  m[nome] = sim;
  if (!scriviMappa(m)) throw new Error('La memoria del browser non è disponibile o è piena.');
  return { nome, modo: 'browser' };
}

async function elimina(nome) {
  if (cartella) { await cartella.removeEntry(nome); return; }
  const m = leggiMappa();
  delete m[nome];
  scriviMappa(m);
}

// --- file singolo ------------------------------------------------------------------

function testoDi(sim) { return JSON.stringify(sim, null, 2); }

function scarica(sim) {
  const testo = testoDi(sim);
  const blob = new Blob([testo], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = nomeFile(sim);
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

function apriFile() {
  return new Promise((ris, rif) => {
    const inp = document.createElement('input');
    inp.type = 'file';
    inp.accept = 'application/json,.json';
    inp.onchange = () => {
      const f = inp.files && inp.files[0];
      if (!f) return rif(new Error('Nessun file selezionato.'));
      const fr = new FileReader();
      fr.onload = () => {
        try { ris(normalizza(JSON.parse(String(fr.result)))); }
        catch { rif(new Error('Il file non contiene una simulazione valida.')); }
      };
      fr.onerror = () => rif(new Error('Lettura del file non riuscita.'));
      fr.readAsText(f);
    };
    inp.click();
  });
}

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];

function h(tag, attrs = {}, ...figli) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === null || v === undefined || v === false) continue;
    if (k === 'class') n.className = v;
    else if (k === 'testo') n.textContent = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v === true ? '' : String(v));
  }
  for (const f of figli.flat()) {
    if (f === null || f === undefined || f === false) continue;
    n.appendChild(typeof f === 'string' || typeof f === 'number' ? document.createTextNode(String(f)) : f);
  }
  return n;
}

const nfEuro = new Intl.NumberFormat('it-IT', { style: 'currency', currency: 'EUR', maximumFractionDigits: 0 });
const nfEuro2 = new Intl.NumberFormat('it-IT', { maximumFractionDigits: 0 });

const euro = (n) => nfEuro.format(Number.isFinite(n) ? n : 0);
const numero = (n) => nfEuro2.format(Number.isFinite(n) ? n : 0);
const perc = (f) => (f === null || f === undefined || !Number.isFinite(f) ? 'n.d.' : (f * 100).toFixed(1).replace('.', ',') + '%');
const segno = (v, s) => (v > 0 ? '+' : '') + s;
const euroSegnato = (n) => segno(n, euro(n));
const punti = (v) => (v === null || !Number.isFinite(v) ? 'n.d.' : segno(v, v.toFixed(1).replace('.', ',')) + ' p.p.');
const percRel = (v) => (v === null || !Number.isFinite(v) ? 'n.d.' : segno(v, v.toFixed(1).replace('.', ',')) + '%');

/** Accetta 1234,56 oppure 1.234,56 oppure 1234.56 senza indovinare a caso. */
function leggiNumero(s) {
  const t = String(s ?? '').trim().replace(/\s/g, '');
  if (!t) return 0;
  let n;
  if (t.includes(',')) n = parseFloat(t.replace(/\./g, '').replace(',', '.'));
  else if (/^-?\d{1,3}(\.\d{3})+$/.test(t)) n = parseFloat(t.replace(/\./g, ''));
  else n = parseFloat(t);
  return Number.isFinite(n) ? n : 0;
}

function imposta(percorso, valore) {
  const parti = percorso.split('.');
  let o = sim;
  for (let i = 0; i < parti.length - 1; i += 1) {
    if (o[parti[i]] === null || typeof o[parti[i]] !== 'object') o[parti[i]] = {};
    o = o[parti[i]];
  }
  o[parti[parti.length - 1]] = valore;
}

function classeMargine(f, target) {
  if (f === null || !Number.isFinite(f)) return 'p-neutro';
  if (target > 0) {
    if (f >= target) return 'p-buono';
    if (f >= target * 0.8) return 'p-attenzione';
    return 'p-critico';
  }
  if (f >= 0.15) return 'p-buono';
  if (f >= 0) return 'p-attenzione';
  return 'p-critico';
}

function avvisa(testo, azione = null) {
  messaggio = testo ? { testo, azione } : null;
  disegnaMessaggio();
  if (testo) {
    const durata = azione ? 20000 : 6000;
    setTimeout(() => {
      if (messaggio && messaggio.testo === testo) { messaggio = null; disegnaMessaggio(); }
    }, durata);
  }
}

function disegnaMessaggio() {
  const c = $('#messaggio');
  if (!c) return;
  c.textContent = '';
  if (!messaggio) { c.hidden = true; c.className = ''; return; }
  c.className = 'avviso';
  c.hidden = false;
  c.appendChild(h('span', { testo: messaggio.testo }));
  if (messaggio.azione) {
    c.appendChild(h('button', {

      onclick: messaggio.azione.onclick,

}

/**
 * Esegue un'azione distruttiva conservando lo stato precedente, e offre di annullarla.
 * Cancellare una linea o una voce senza via di ritorno costringe a riscrivere tutto a mano.
 */
function conAnnulla(descrizione, azione) {
  const prima = JSON.parse(JSON.stringify(sim));
  azione();
  ripristino = prima;
  disegna();
  avvisa(descrizione, {
    testo: 'Annulla',
    onclick: () => {
      if (!ripristino) return;
      sim = normalizza(ripristino);
      ripristino = null;
      disegna();
      avvisa('Ripristinato.');
    },
  });
}

function rigaVoce(linea, iL, voce, iV) {
  const base = `linee.${iL}.voci.${iV}`;
  const nome = h('input', {
    type: 'text', value: voce.nome, list: 'sugg-' + voce.cat,
    oninput: (e) => { voce.nome = e.target.value; },
  });
  const celleNome = [nome];
  if (voce.cat === 'manodopera') {
    celleNome.push(h('select', {
      title: 'Tipo di manodopera a cui è agganciata la tariffa oraria',
      style: 'margin-top:3px',

    },
    h('option', { value: '', testo: '— nessuna tariffa —' }),
    ...sim.tariffe.map((t) => h('option', {
      value: t.id, selected: t.id === voce.tariffaId,
      testo: `${t.nome} · ${t.eurOra ? numero(t.eurOra) + ' €/h' : 'da impostare'}`,
    }))));
  }
  return h('tr', {},
    h('td', {}, ...celleNome),
    cellaValore(voce, 'preventivo', base),
    cellaValore(voce, 'kom', base),

function cursore(etichetta, percorso, valore, uscita) {
  const nInput = h('input', {
    type: 'text', inputmode: 'decimal', class: 'num', value: String(valore ?? 0).replace('.', ','),
    oninput: (e) => {
      const v = leggiNumero(e.target.value);
      imposta(percorso, v);
      range.value = Math.max(-60, Math.min(60, v));
      aggiornaDerivati();
    },
  });
  const range = h('input', {
    type: 'range', min: -60, max: 60, step: 1, value: Math.max(-60, Math.min(60, valore ?? 0)),
    'aria-label': etichetta,
    oninput: (e) => {
      const v = Number(e.target.value);
      imposta(percorso, v);
      nInput.value = String(v).replace('.', ',');
      aggiornaDerivati();
    },
  });
  return h('div', { class: 'cursore' },
    h('div', { class: 'et', testo: etichetta, title: etichetta }),
    range,
    h('div', { class: 'coppia' }, nInput, h('span', { class: 'suff', testo: '%' })),
    uscita ? h('div', { class: 'esito', 'data-out': uscita, testo: '—' }) : null);
}

/** Effetto della simulazione, mostrato dove si agisce: senza questo riquadro si muovono i
 *  cursori e il risultato si vede solo cambiando scheda. */
function riepilogoSimulazione() {
  const righe = [
    ['ricavo', 'euro', 'Ricavo'],
    ['cd', 'euro', 'Costi diretti'],
    ['mdc', 'euro', 'Margine di contribuzione'],
    ['mdcPct', 'perc', 'Marginalità'],
    ['mi', 'euro', 'Margine industriale'],
    ['miPct', 'perc', 'Margine industriale %'],
  ];
  return h('section', { class: 'pannello' },
    h('h2', { testo: 'Effetto della simulazione' }),
    h('div', { class: 'corpo' },
      h('p', { class: 'nota', style: 'margin-top:0', id: 'base-simulazione', testo: '' }),
      h('div', { class: 'tabellone' }, h('table', {},
        h('thead', {}, h('tr', {},
          h('th', { testo: 'Grandezza' }),
          h('th', { class: 'n', 'data-out': 'cmp:intestazione', testo: 'Base' }),
          h('th', { class: 'n', testo: 'Simulato' }),
          h('th', { class: 'n', testo: 'Variazione' }))),
        h('tbody', {}, ...righe.map(([k, f, et]) => h('tr', k === 'mdc' || k === 'miPct' ? { class: 'somma' } : {},
          h('td', { testo: et }),
          h('td', { class: 'n', 'data-out': `cmp:${k}:base:${f}`, testo: '—' }),
          h('td', { class: 'n', 'data-out': `cmp:${k}:sim:${f}`, testo: '—' }),
          h('td', { class: 'n', 'data-out': `cmp:${k}:delta:${f}`, testo: '—' })))))))); 
}

function schedaSimulazione() {
  const globali = h('div', { class: 'cursori' },
    cursore('Tutti i costi', 'delta.globale', sim.delta.globale),
    cursore('Tutti i ricavi', 'delta.ricavo', sim.delta.ricavo));

  const perLinea = sim.linee.map((l) => h('section', { class: 'pannello' },
    h('h2', { testo: l.nome || 'Linea' }),
    h('div', { class: 'corpo' },
      h('div', { class: 'cursori' },
        cursore('Ricavo della linea', `delta.ricavoLinea.${l.id}`, sim.delta.ricavoLinea?.[l.id] ?? 0),
        cursore('Tutti i costi della linea', `delta.linea.${l.id}`, sim.delta.linea?.[l.id] ?? 0),
        ...CATEGORIE.filter((c) => l.voci.some((v) => v.cat === c)).map((c) =>
          cursore(ETICHETTA_CATEGORIA[c], `delta.catLinea.${l.id}|${c}`, sim.delta.catLinea?.[`${l.id}|${c}`] ?? 0, `catsim:${l.id}:${c}`))))));

  return h('div', {},
    riepilogoSimulazione(),
    h('section', { class: 'pannello' },
      h('h2', { testo: 'Scostamenti complessivi' }),
      h('div', { class: 'corpo' }, globali,
        h('p', { class: 'nota' }, 'Gli scostamenti si applicano alla colonna KOM e si compongono moltiplicativamente: complessivo, poi linea, poi categoria. Il KOM non viene modificato.'),
        h('button', {
          style: 'margin-top:8px', testo: 'Azzera tutti gli scostamenti',
          onclick: () => { sim.delta = { ricavo: 0, ricavoLinea: {}, globale: 0, linea: {}, catLinea: {}, voce: {} }; disegna(); },
        }))),
    ...perLinea,
    h('section', { class: 'pannello' },
      h('h2', { testo: 'Sensitività: quali voci pesano di più' }),
      h('div', { class: 'corpo' },
        h('div', { id: 'tornado' }),
        h('p', { class: 'nota', testo: 'Effetto sul margine industriale simulato di una variazione di più o meno 10% su ciascun blocco, tenendo fermo tutto il resto. Ordinato per ampiezza.' }))));
}

          h('div', { class: 'metrica forte' }, h('div', { class: 'et', testo: 'Riserva residua' }), h('div', { class: 'val', 'data-out': 'tot:simulato:riserva:euro', testo: '—' })),

function schedaArchivio() {
  const modoArchivio = modo();
  const azioni = h('div', { class: 'azioni', style: 'margin-bottom:12px' },
    h('button', {
      class: 'primario', testo: 'Salva nell’archivio',
      onclick: async () => {
        try {
          const r = await salva(sim);
          await ricaricaArchivio();
          avvisa(`Salvata come ${r.nome}.`);
        } catch (e) { avvisa('Salvataggio non riuscito: ' + e.message); }
      },
    }),
    supportaCartella() ? h('button', {
      testo: modoArchivio === 'cartella' ? 'Cambia cartella' : 'Scegli la cartella di rete',
      onclick: async () => {
        try { await scegliCartella(); await ricaricaArchivio(); disegna(); avvisa('Cartella collegata.'); }
        catch (e) { if (e.name !== 'AbortError') avvisa('Cartella non collegata: ' + e.message); }
      },
    }) : null,
    h('button', {
      testo: 'Scarica come file',
      onclick: () => {
        if (incorporata()) offriTesto('Simulazione in formato JSON', nomeFile(sim), JSON.stringify(sim, null, 2));
        else scarica(sim);
      },
    }),
    h('button', {
      testo: 'Apri da file',
      onclick: async () => {
        try { sim = await apriFile(); disegna(); avvisa('Simulazione caricata.'); }
        catch (e) { avvisa(e.message); }
      },
    }),
    h('button', {
      testo: 'Nuova simulazione',
      onclick: () => {
        if (!confirm('Azzerare la simulazione corrente? Quello che non è stato salvato va perso.')) return;
        sim = nuovaSimulazione(); scheda = 'dati'; disegna(); avvisa('Nuova simulazione, maschera vuota.');
      },
    }));

  const elenco = h('div', { class: 'elenco-archivio' },
    elencoArchivio.length === 0
      ? h('div', { class: 'vuoto', testo: 'Nessuna simulazione in archivio.' })
      : elencoArchivio.map((v) => {
        const r = calcolaColonna(v.sim, 'simulato');
        return h('div', { class: 'voce-archivio' },
          h('div', { class: 'id' },
            h('b', { testo: `${v.codice}${v.cliente ? ' · ' + v.cliente : ''}` }),
            h('small', { testo: `${v.descrizione ? v.descrizione + ' · ' : ''}${v.nome}` })),
          h('div', { style: 'display:flex;gap:10px;align-items:center;flex-wrap:wrap' },
            h('span', { class: 'pillola ' + classeMargine(r.miPct, (v.sim.parametri?.targetPct || 0) / 100), testo: 'MI ' + perc(r.miPct) }),
            h('button', {
              testo: 'Apri',
              onclick: () => { sim = normalizza(JSON.parse(JSON.stringify(v.sim))); scheda = 'dati'; disegna(); avvisa('Aperta ' + v.nome + '. Salvando si crea una nuova voce, l’originale resta.'); },
            }),
            h('button', {
              class: 'muto', testo: 'Elimina',
              onclick: async () => {
                if (!confirm('Eliminare ' + v.nome + '?')) return;
                await elimina(v.nome); await ricaricaArchivio(); disegna();
              },
            })));
      }));

  const nota = modoArchivio === 'cartella'
    ? h('p', { class: 'nota', testo: 'Archivio su cartella di rete. I file restano anche se il browser viene ripulito, sono visibili da Esplora risorse e rientrano nel backup aziendale.' })
    : h('div', { class: 'avviso' }, h('span', {}, 'Archivio nella memoria di questo browser. È un ripiego: sparisce con la pulizia dei dati di navigazione e non è condiviso con gli altri PM. ' + (supportaCartella() ? 'Collega una cartella di rete per un archivio vero.' : 'Il collegamento a una cartella richiede Chrome o Edge su desktop; altrimenti usa Scarica come file.')));

  return h('div', {},
    h('section', { class: 'pannello' },
      h('h2', { testo: 'Archivio delle simulazioni' }),
      h('div', { class: 'corpo' },
        azioni, nota,
        h('p', { class: 'nota', testo: 'Ogni salvataggio crea una nuova voce datata. Niente si aggiorna nel tempo: una simulazione è una fotografia della data in cui è stata fatta.' }))),
    h('section', { class: 'pannello' }, h('h2', { testo: 'Simulazioni salvate' }), h('div', { class: 'corpo' }, elenco)));
}

async function ricaricaArchivio() {
  try { elencoArchivio = await elenca(); }
  catch { elencoArchivio = []; }
  if (scheda === 'archivio') disegna();
}

// --- grafici -----------------------------------------------------------------------

function svg(tag, attrs, ...figli) {
  const n = document.createElementNS('http://www.w3.org/2000/svg', tag);
  for (const [k, v] of Object.entries(attrs || {})) if (v !== null && v !== undefined) n.setAttribute(k, String(v));
  for (const f of figli.flat()) if (f) n.appendChild(f);
  return n;
}
function testoSvg(x, y, t, attrs = {}) {
  const n = svg('text', { x, y, 'font-size': 10, ...attrs });
  n.textContent = t;
  return n;
}

function disegnaCascata(r) {
  const c = $('#cascata');
  if (!c) return;
  c.textContent = '';
  const g1 = r.gapPreventivoKom;
  const g2 = r.gapKomSimulato;
  const passi = [
    { et: 'MdC preventivo', v: r.colonne.preventivo.mdc, tipo: 'totale' },
    { et: 'Effetto ricavo', v: g1.effettoRicavo, tipo: 'delta' },
    { et: 'Effetto costo', v: g1.effettoCosto, tipo: 'delta' },
    { et: 'MdC KOM', v: r.colonne.kom.mdc, tipo: 'totale' },
    { et: 'Effetto ricavo', v: g2.effettoRicavo, tipo: 'delta' },
    { et: 'Effetto costo', v: g2.effettoCosto, tipo: 'delta' },
    { et: 'MdC simulato', v: r.colonne.simulato.mdc, tipo: 'totale' },
  ];
  const L = 760, A = 230, mB = 46, mT = 18, mL = 8, mR = 8;
  let cur = 0;
  const seg = passi.map((p) => {
    if (p.tipo === 'totale') { const s = { ...p, da: 0, a: p.v }; cur = p.v; return s; }
    const da = cur; cur += p.v; return { ...p, da, a: cur };
  });
  const valori = seg.flatMap((s) => [s.da, s.a, 0]);
  const min = Math.min(...valori), max = Math.max(...valori);
  const span = (max - min) || 1;
  const y = (v) => mT + (A - mT - mB) * (1 - (v - min) / span);
  const w = (L - mL - mR) / passi.length;

  const nodi = [svg('line', { class: 'asse', x1: mL, x2: L - mR, y1: y(0), y2: y(0), 'stroke-width': 1 })];
  seg.forEach((s, i) => {
    const x = mL + i * w + w * 0.18;
    const bw = w * 0.64;
    const y1 = y(Math.max(s.da, s.a)), y2 = y(Math.min(s.da, s.a));
    const positivo = s.tipo === 'totale' ? s.a >= 0 : s.v >= 0;
    const fill = s.tipo === 'totale' ? 'var(--accento)' : (positivo ? 'var(--buono)' : 'var(--critico)');
    nodi.push(svg('rect', { x, y: y1, width: bw, height: Math.max(2, y2 - y1), fill, rx: 2 }));
    nodi.push(testoSvg(x + bw / 2, y1 - 5, s.tipo === 'totale' ? euro(s.a) : euroSegnato(s.v),
      { 'text-anchor': 'middle', 'font-size': 10, 'font-weight': 600 }));
    const et = testoSvg(x + bw / 2, A - mB + 16, s.et, { 'text-anchor': 'middle', 'font-size': 9.5 });
    nodi.push(et);
    if (i < seg.length - 1) nodi.push(svg('line', { class: 'griglia', x1: x + bw, x2: mL + (i + 1) * w + w * 0.18, y1: y(s.a), y2: y(s.a), 'stroke-dasharray': '2 2', 'stroke-width': 1 }));
  });
  const s = svg('svg', { viewBox: `0 0 ${L} ${A}`, width: '100%', role: 'img', 'aria-label': 'Cascata del margine di contribuzione' }, ...nodi);
  c.appendChild(h('div', { class: 'tabellone' }, s));
}

function disegnaTornado() {
  const c = $('#tornado');
  if (!c) return;
  c.textContent = '';
  const s = sensitivita(sim, 10);
  const righe = s.righe.slice(0, 10).filter((r) => r.ampiezza > 0);
  if (righe.length === 0) {
    c.appendChild(h('p', { class: 'nota', testo: 'Inserisci dei costi nella colonna KOM per vedere quali voci pesano di più.' }));
    return;
  }
  const maxA = Math.max(...righe.map((r) => Math.max(Math.abs(r.su), Math.abs(r.giu))));
  const L = 760, hr = 22, mT = 20, mB = 22, etW = 230;
  const A = mT + righe.length * hr + mB;
  const cx = etW + (L - etW - 10) / 2;
  const semi = (L - etW - 20) / 2;
  const nodi = [svg('line', { class: 'asse', x1: cx, x2: cx, y1: mT - 6, y2: A - mB + 2, 'stroke-width': 1 })];
  righe.forEach((r, i) => {
    const yy = mT + i * hr;
    nodi.push(testoSvg(etW - 8, yy + 11, r.etichetta.length > 38 ? r.etichetta.slice(0, 37) + '…' : r.etichetta, { 'text-anchor': 'end', 'font-size': 10 }));
    for (const [v, colore] of [[r.giu, 'var(--buono)'], [r.su, 'var(--critico)']]) {
      const lw = (Math.abs(v) / maxA) * semi;
      nodi.push(svg('rect', { x: v >= 0 ? cx : cx - lw, y: yy + 3, width: Math.max(1, lw), height: hr - 9, fill: colore, rx: 2, opacity: .85 }));
    }
    nodi.push(testoSvg(cx + semi + 6, yy + 11, euroSegnato(r.su), { 'font-size': 9.5, 'text-anchor': 'end', x: L - 4 }));
  });
  nodi.push(testoSvg(cx, A - 6, 'margine industriale, effetto di ±10%', { 'text-anchor': 'middle', 'font-size': 9.5 }));
  c.appendChild(h('div', { class: 'tabellone' },
    svg('svg', { viewBox: `0 0 ${L} ${A}`, width: '100%', role: 'img', 'aria-label': 'Sensitività del margine ai driver di costo' }, ...nodi)));
}

// --- aggiornamento dei valori derivati ---------------------------------------------

function scrivi(sel, testo, classe) {
  for (const n of $$(`[data-out="${sel}"]`)) {
    n.textContent = testo;
    n.classList.remove('v-buono', 'v-critico');
    if (classe) n.classList.add(classe);
  }
}

function formatta(v, formato) {
  if (formato === 'perc') return perc(v);
  if (formato === 'punti') return punti(v);
  if (formato === 'rel') return percRel(v);
  return euro(v);
}

function aggiornaDerivati() {
  const r = calcola(sim);
  const target = (sim.parametri.targetPct || 0) / 100;

  for (const c of COLONNE) {
    const col = r.colonne[c];
    for (const [k, v] of Object.entries(col)) {
      if (typeof v === 'number' || v === null) {
        scrivi(`tot:${c}:${k}:euro`, formatta(v, 'euro'));
        scrivi(`tot:${c}:${k}:perc`, formatta(v, 'perc'));
      }
    }
    for (const l of col.linee) {
      scrivi(`cdcol:${l.id}:${c}`, euro(l.cd));
      scrivi(`mdclinea:${l.id}:${c}`, `${euro(l.mdc)}  ·  ${perc(l.mdcPct)}`);
      for (const cat of CATEGORIE) scrivi(`catcol:${l.id}:${cat}:${c}`, euro(l.perCategoria[cat]));
    }
  }

  const s = r.colonne.simulato;
  for (const l of s.linee) {
    scrivi('ricavo:' + l.id, euro(l.ricavo));
    for (const cat of CATEGORIE) scrivi(`cat:${l.id}:${cat}`, euro(l.perCategoria[cat]));
    for (const [idVoce, costo] of Object.entries(l.voci)) scrivi('voce:' + idVoce, euro(costo));
  }
  const kom = r.colonne.kom;
  for (const l of kom.linee) {
    for (const cat of CATEGORIE) {
      const base = l.perCategoria[cat];
      const simCat = s.linee.find((x) => x.id === l.id)?.perCategoria[cat] ?? 0;
      scrivi(`catsim:${l.id}:${cat}`, base ? euroSegnato(simCat - base) : '—');
    }
  }

  for (const [chiave, g] of [['gapPreventivoKom', r.gapPreventivoKom], ['gapKomSimulato', r.gapKomSimulato]]) {
    for (const [k, formato] of [['dMdc', 'euro'], ['dMi', 'euro'], ['dMdcPp', 'punti'], ['dMiPp', 'punti'], ['dMdcRel', 'rel'], ['dMiRel', 'rel'], ['effettoRicavo', 'euro'], ['effettoCosto', 'euro']]) {
      const v = g[k];
      scrivi(`gap:${chiave}:${k}:${formato}`, formatta(v, formato), v === null ? null : (v >= 0 ? 'v-buono' : 'v-critico'));
    }
    const tb = $(`[data-lista="perlinea:${chiave}"]`);
    if (tb) {
      tb.textContent = '';
      for (const l of g.perLinea) {
        tb.appendChild(h('tr', {},
          h('td', { testo: l.nome }),
          h('td', { class: 'n ' + (l.effettoRicavo >= 0 ? 'v-buono' : 'v-critico'), testo: euroSegnato(l.effettoRicavo) }),
          ...CATEGORIE.map((c) => h('td', { class: 'n ' + (l.perCategoria[c] >= 0 ? 'v-buono' : 'v-critico'), testo: euroSegnato(l.perCategoria[c]) })),
          h('td', { class: 'n', style: 'font-weight:600', testo: euroSegnato(l.dMdc) })));
      }
    }
  }

  // barra risultati
  scrivi('barra:ricavo', euro(s.ricavo));
  scrivi('barra:costi', euro(s.cd));
  scrivi('barra:mdc', euro(s.mdc));
  for (const c of COLONNE) scrivi(`barra:mdcpct:${c}`, perc(r.colonne[c].mdcPct));
  scrivi('barra:mi', euro(s.mi));

  const colBase = r.colonne[r.baseSimulazione];
  const gSim = gap(colBase, s);
  scrivi('cmp:intestazione', ETICHETTA_COLONNA[r.baseSimulazione]);
  for (const [k, formato] of [['ricavo', 'euro'], ['cd', 'euro'], ['mdc', 'euro'], ['mdcPct', 'perc'], ['mi', 'euro'], ['miPct', 'perc']]) {
    scrivi(`cmp:${k}:base:${formato}`, formatta(colBase[k], formato));
    scrivi(`cmp:${k}:sim:${formato}`, formatta(s[k], formato));
    if (formato === 'perc') {
      const pp = (colBase[k] === null || s[k] === null) ? null : (s[k] - colBase[k]) * 100;
      scrivi(`cmp:${k}:delta:${formato}`, punti(pp), pp === null ? null : (pp >= 0 ? 'v-buono' : 'v-critico'));
    } else {
      const d = s[k] - colBase[k];
      const positivo = k === 'cd' ? d <= 0 : d >= 0;
      scrivi(`cmp:${k}:delta:${formato}`, euroSegnato(d), positivo ? 'v-buono' : 'v-critico');
    }
  }
  const nb = $('#base-simulazione');
  if (nb) {
    nb.textContent = r.baseSimulazione === 'kom'
      ? 'La simulazione parte dalla colonna KOM. Gli scostamenti non modificano il KOM: creano una terza colonna.'
      : 'La colonna KOM è ancora vuota, quindi la simulazione parte dal Preventivo. Compilando il KOM la base passa automaticamente a quello.';
  }
  void gSim;

  const pil = $('#semaforo');
  if (pil) {
    pil.className = 'pillola ' + classeMargine(s.miPct, target);
    pil.textContent = 'MI simulato ' + perc(s.miPct) + (target > 0 ? ' · obiettivo ' + perc(target) : '');
  }

  const lettura = $('#lettura-riserva');
  if (lettura) {
    if (!(s.ricavo > 0)) lettura.textContent = 'Inserisci i ricavi di linea per calcolare la riserva.';
    else if (s.riserva >= 0) lettura.textContent = `I costi possono crescere di ${euro(s.riserva)} (${perc(s.riservaPct)}) prima di scendere sotto il margine obiettivo.`;
    else lettura.textContent = `I costi superano già di ${euro(-s.riserva)} il massimo compatibile con il margine obiettivo: servono ${perc(-s.riservaPct)} di riduzione.`;
  }

  if (scheda === 'confronto') disegnaCascata(r);
  if (scheda === 'simulazione') disegnaTornado();

  salvaBozza(sim);
}

// --- struttura -----------------------------------------------------------------------

const SCHEDE = [
  ['dati', 'Dati di commessa'],
  ['simulazione', 'Simulazione'],
  ['confronto', 'Confronto'],
  ['archivio', 'Archivio'],
];

/** In un contenitore incorporato i download vengono bloccati senza alcun errore visibile.
 *  In quel caso si offre il testo da copiare, invece di un pulsante che non fa nulla. */
function incorporata() {
  try { return window.self !== window.top; } catch { return true; }
}

function offriTesto(titolo, nomeSuggerito, testo) {
  const area = h('textarea', { readonly: true, spellcheck: 'false' });
  area.value = testo;
  const pannello = h('section', { class: 'pannello riquadro-testo' },
    h('h2', { testo: titolo }),
    h('div', { class: 'corpo' },
      h('p', { class: 'nota', style: 'margin-top:0' }, `Il salvataggio diretto non è disponibile in questa finestra. Copia il testo e incollalo in un file chiamato ${nomeSuggerito}.`),
      area,
      h('div', { class: 'azioni', style: 'margin-top:8px' },
        h('button', {
          class: 'primario', testo: 'Copia negli appunti',
          onclick: async () => {
            area.select();
            try { await navigator.clipboard.writeText(testo); avvisa('Copiato negli appunti.'); }
            catch { avvisa('Copia automatica non riuscita: il testo è selezionato, usa Ctrl+C.'); }
          },
        }),
        h('button', { testo: 'Chiudi', onclick: () => pannello.remove() }))));
  const main = document.querySelector('main');
  main.insertBefore(pannello, main.firstChild || null);
  area.focus();
  area.select();
}

function consegna(nomeFileCompleto, tipo, contenuto, titolo) {
  if (incorporata()) { offriTesto(titolo, nomeFileCompleto, contenuto); return; }
  consegna(nomeFile(sim).replace(/\.json$/, '.csv'), 'text/csv;charset=utf-8', '﻿' + csv,
    'Esportazione CSV');
}

function esportaCsv() {
  const r = calcola(sim);
  const righe = [['Commessa', sim.meta.codice], ['Cliente', sim.meta.cliente], ['Data', sim.meta.data], []];
  righe.push(['Linea', 'Categoria', 'Voce', 'Preventivo', 'KOM', 'Simulato']);
  for (const linea of sim.linee) {
    for (const cat of CATEGORIE) {
      for (const v of linea.voci.filter((x) => x.cat === cat)) {
        righe.push([linea.nome, ETICHETTA_CATEGORIA[cat], v.nome,
          r.colonne.preventivo.linee.find((l) => l.id === linea.id)?.voci[v.id] ?? 0,
          r.colonne.kom.linee.find((l) => l.id === linea.id)?.voci[v.id] ?? 0,
          r.colonne.simulato.linee.find((l) => l.id === linea.id)?.voci[v.id] ?? 0]);
      }
    }
    righe.push([linea.nome, 'Ricavo', '', ...COLONNE.map((c) => r.colonne[c].linee.find((l) => l.id === linea.id)?.ricavo ?? 0)]);
  }
  righe.push([]);
  for (const [et, k] of [['Ricavo', 'ricavo'], ['Costi diretti', 'cd'], ['Margine di contribuzione', 'mdc'], ['Spese generali', 'speseGenerali'], ['Contingency', 'contingency'], ['Margine industriale', 'mi']]) {
    righe.push(['TOTALE', et, '', ...COLONNE.map((c) => r.colonne[c][k])]);
  }
  righe.push(['TOTALE', 'Marginalità %', '', ...COLONNE.map((c) => (r.colonne[c].mdcPct ?? 0) * 100)]);
  righe.push(['TOTALE', 'Margine industriale %', '', ...COLONNE.map((c) => (r.colonne[c].miPct ?? 0) * 100)]);

  const csv = righe.map((r2) => r2.map((c) => {
    const s = typeof c === 'number' ? String(Math.round(c * 100) / 100).replace('.', ',') : String(c ?? '');
    return /[";\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  }).join(';')).join('\r\n');

  const blob = new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = nomeFile(sim).replace(/\.json$/, '.csv');
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

function disegna() {
  const radice = $('#radice');
  radice.textContent = '';

  const nav = h('nav', { class: 'schede', role: 'tablist' },
    ...SCHEDE.map(([k, et]) => h('button', {
      role: 'tab', 'aria-selected': scheda === k ? 'true' : 'false', testo: et,
      onclick: () => { scheda = k; disegna(); },
    })));

  let contenuto;
  try {
    contenuto = scheda === 'dati' ? schedaDati()
      : scheda === 'simulazione' ? schedaSimulazione()
        : scheda === 'confronto' ? schedaConfronto()
          : schedaArchivio();
  } catch (e) {
    // Meglio una schermata che spiega il problema di una pagina bianca: i dati inseriti
    // restano in memoria e le altre schede continuano a funzionare.
    contenuto = h('div', { class: 'avviso' },
      h('span', {}, 'Questa scheda non si è potuta aprire: ' + (e && e.message ? e.message : 'errore sconosciuto')
        + '. Le altre schede e i dati inseriti non sono stati toccati.'));
  }

  const main = h('main', {}, contenuto);

  radice.appendChild(nav);
  radice.appendChild(main);
  disegnaMessaggio();
  aggiornaDerivati();
}

function testa() {
  return h('header', { class: 'testa' },
    h('div', { class: 'marchio' },
      h('strong', { testo: 'Simulatore margine di commessa' }),
      h('span', { testo: 'Righi Solutions' })),
    h('div', { class: 'azioni' },
      h('button', { testo: 'Esporta CSV', onclick: esportaCsv }),
      h('button', { testo: 'Stampa', onclick: () => window.print() }),
      h('button', {
        class: 'primario', testo: 'Salva nell’archivio',
        onclick: async () => {
          try { const r = await salva(sim); await ricaricaArchivio(); avvisa(`Salvata come ${r.nome}.`); }
          catch (e) { avvisa('Salvataggio non riuscito: ' + e.message); }
        },
      })));
}

function barra() {
  return h('footer', { class: 'barra' },
    h('span', { class: 'pillola p-neutro', id: 'semaforo', testo: '—' }),
    h('div', { class: 'metrica' }, h('div', { class: 'et', testo: 'Ricavo simulato' }), h('div', { class: 'val', 'data-out': 'barra:ricavo', testo: '—' })),
    h('div', { class: 'metrica' }, h('div', { class: 'et', testo: 'Costi diretti' }), h('div', { class: 'val', 'data-out': 'barra:costi', testo: '—' })),
    h('div', { class: 'metrica forte' }, h('div', { class: 'et', testo: 'MdC simulato' }), h('div', { class: 'val', 'data-out': 'barra:mdc', testo: '—' })),
    h('div', { class: 'metrica' }, h('div', { class: 'et', testo: 'Marginalità prev.' }), h('div', { class: 'val', 'data-out': 'barra:mdcpct:preventivo', testo: '—' })),
    h('div', { class: 'metrica' }, h('div', { class: 'et', testo: 'Marginalità KOM' }), h('div', { class: 'val', 'data-out': 'barra:mdcpct:kom', testo: '—' })),
    h('div', { class: 'metrica forte' }, h('div', { class: 'et', testo: 'Marginalità sim.' }), h('div', { class: 'val', 'data-out': 'barra:mdcpct:simulato', testo: '—' })));
}

function datalist() {
  return h('div', { hidden: true },
    ...CATEGORIE.map((c) => h('datalist', { id: 'sugg-' + c },
      ...SUGGERIMENTI[c].map((s) => h('option', { value: s })))));
}

function avvia() {
  document.body.appendChild(testa());
  document.body.appendChild(h('div', { id: 'radice' }));
  document.body.appendChild(h('div', { id: 'messaggio', hidden: true }));
  document.body.appendChild(barra());
  document.body.appendChild(datalist());

  const bozza = leggiBozza();
  const bozzaUtile = bozza && (bozza.meta.codice || bozza.linee.some((l) => l.voci.some((v) => v.kom.q || v.preventivo.q)));
  sim = bozzaUtile ? bozza : simulazioneEsempio();

  disegna();
  ripristinaCartella().then(() => ricaricaArchivio());
}


if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", avvia);

else avvia();
</script>

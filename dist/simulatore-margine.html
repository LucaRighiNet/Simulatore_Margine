  --ink: #e4eaf1;
  --ink-2: #a7b5c4;
  --ink-3: #7f8e9e;
  --linea: #2c3743;
  --linea-forte: #3d4a58;
  --accento: #63a8e8;
  --accento-tenue: #16293c;
  --buono: #5fc08d;
  --buono-tenue: #14291f;
  --attenzione: #d9a75a;
  --attenzione-tenue: #2e2517;
  --critico: #e8857a;
  --critico-tenue: #2f1c1a;
  --ombra: 0 1px 2px rgba(0, 0, 0, .4);
}

* { box-sizing: border-box; }

[hidden] { display: none !important; }

body {
  margin: 0;
  background: var(--ground);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 14px;
  line-height: 1.45;
  -webkit-text-size-adjust: 100%;
}

h1, h2, h3 { text-wrap: balance; margin: 0; font-weight: 600; }

.testa {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 30;
  display: flex;
  flex-wrap: wrap;
  gap: 10px 16px;
  align-items: center;
  justify-content: space-between;
  padding: 10px 16px;
  background: var(--surface);
  border-bottom: 1px solid var(--linea);
}

.marchio { display: flex; align-items: baseline; gap: 10px; }
.marchio strong { font-size: 15px; letter-spacing: -.01em; }
.marchio span {
  font-size: 10.5px; text-transform: uppercase; letter-spacing: .09em;
  color: var(--ink-3); border-left: 1px solid var(--linea-forte); padding-left: 10px;
}

.azioni { display: flex; flex-wrap: wrap; gap: 6px; }

button {
  font: inherit; font-size: 12.5px;
  padding: 6px 11px; border-radius: var(--r);
  border: 1px solid var(--linea-forte); background: var(--surface); color: var(--ink);
  cursor: pointer;
}
button:hover { border-color: var(--accento); color: var(--accento); }
button:focus-visible { outline: 2px solid var(--accento); outline-offset: 1px; }
button.primario { background: var(--accento); border-color: var(--accento); color: #fff; }

/* Scelta corrente, non comando: si distingue dal pieno pieno dei pulsanti che agiscono. */
button.selezionato {
  background: var(--accento-tenue);
  border-color: var(--accento);
  color: var(--accento);
  font-weight: 600;
}
button.selezionato:hover { background: var(--accento-tenue); }
button.primario:hover { filter: brightness(1.08); color: #fff; }
button.muto { border-color: transparent; color: var(--ink-3); padding: 3px 6px; }
button.muto:hover { color: var(--critico); border-color: var(--critico); }

.schede {
  display: flex; gap: 2px; padding: 0 16px;
  background: var(--surface); border-bottom: 1px solid var(--linea);
  overflow-x: auto;
}
.schede button {
  border: 0; border-bottom: 2px solid transparent; border-radius: 0;
  padding: 9px 12px; color: var(--ink-2); background: none; white-space: nowrap;
}
.schede button[aria-selected="true"] { color: var(--accento); border-bottom-color: var(--accento); font-weight: 600; }

main { padding: 16px; padding-bottom: 112px; max-width: 1400px; margin: 0 auto; }

#messaggio.avviso {
  position: fixed;
  left: 50%;
  transform: translateX(-50%);
  bottom: calc(74px + env(safe-area-inset-bottom, 0px));
  z-index: 50;
  width: max-content;
  max-width: min(660px, calc(100% - 32px));
  margin: 0;
  align-items: center;
  background: var(--surface);
  color: var(--ink);
  border-color: var(--linea-forte);
  box-shadow: 0 6px 26px rgba(23, 33, 44, .22);
}

.avviso {
  display: flex; gap: 10px; align-items: flex-start;
  padding: 9px 12px; border-radius: var(--r); margin-bottom: 14px;
  background: var(--attenzione-tenue); color: var(--attenzione);
  border: 1px solid color-mix(in srgb, var(--attenzione) 30%, transparent);
  font-size: 12.5px;
}

.pannello {
  background: var(--surface); border: 1px solid var(--linea);
  border-radius: var(--r); box-shadow: var(--ombra); margin-bottom: 14px;
}
.pannello > h2 {
  font-size: 11px; text-transform: uppercase; letter-spacing: .09em; color: var(--ink-3);
  padding: 10px 14px; border-bottom: 1px solid var(--linea);
}
.corpo { padding: 12px 14px; }

.campi { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px 14px; }
label.campo { display: flex; flex-direction: column; gap: 3px; font-size: 11px; color: var(--ink-2); }
label.campo > span { text-transform: uppercase; letter-spacing: .06em; font-size: 10px; color: var(--ink-3); }

input, select {
  font: inherit; font-size: 13px; color: var(--ink);
  background: var(--surface); border: 1px solid var(--linea-forte);
  border-radius: 4px; padding: 5px 7px; width: 100%; min-width: 0;
}
input:focus, select:focus { outline: 2px solid var(--accento); outline-offset: -1px; border-color: var(--accento); }
input[type="number"], input.num { font-family: var(--mono); font-variant-numeric: tabular-nums; text-align: right; }
/* Anche fuori dalle tabelle un campo numerico non si allunga oltre il necessario. */
label.campo input.num { max-width: 160px; }
input:read-only { background: var(--surface-2); color: var(--ink-2); }

.tabellone { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { padding: 4px 7px; text-align: left; border-bottom: 1px solid var(--linea); vertical-align: middle; }
th {
  font-size: 10px; text-transform: uppercase; letter-spacing: .07em;
  color: var(--ink-3); font-weight: 600; white-space: nowrap;
}
td.n, th.n { text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
th.n { font-family: var(--sans); }
tr.cat td {
  background: var(--surface-2); font-size: 10px; text-transform: uppercase;
  letter-spacing: .08em; color: var(--ink-2); font-weight: 600; border-bottom-color: var(--linea-forte);
}
tr.somma td { font-weight: 600; background: color-mix(in srgb, var(--accento-tenue) 55%, transparent); }
tr.somma td.n { font-family: var(--mono); }
.linea-titolo { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-bottom: 1px solid var(--linea); }
.linea-titolo input { font-size: 14px; font-weight: 600; border-color: transparent; background: none; }
.linea-titolo input:hover { border-color: var(--linea-forte); }

.coppia { display: flex; gap: 4px; align-items: center; }
.coppia input { width: 100%; }
.coppia .suff { font-size: 10px; color: var(--ink-3); white-space: nowrap; }

.derivato { color: var(--ink-2); font-family: var(--mono); font-variant-numeric: tabular-nums; }

.barra {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
  background: var(--surface); border-top: 1px solid var(--linea-forte);
  padding: 8px 16px; padding-bottom: calc(8px + env(safe-area-inset-bottom, 0px));
  display: flex; flex-wrap: wrap; gap: 6px 18px; align-items: center;
  box-shadow: 0 -2px 10px rgba(23, 33, 44, .06);
}
.metrica { display: flex; flex-direction: column; gap: 0; min-width: 76px; }
.metrica .et { font-size: 9.5px; text-transform: uppercase; letter-spacing: .07em; color: var(--ink-3); }
.metrica .val { font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: 15px; font-weight: 500; }
.metrica.forte .val { font-size: 17px; font-weight: 600; }

.pillola {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 3px 9px; border-radius: 99px; font-size: 11.5px; font-weight: 600;
}
.pillola::before { content: ""; width: 7px; height: 7px; border-radius: 99px; background: currentColor; }
.p-buono { background: var(--buono-tenue); color: var(--buono); }
.p-attenzione { background: var(--attenzione-tenue); color: var(--attenzione); }
.p-critico { background: var(--critico-tenue); color: var(--critico); }
.p-neutro { background: var(--surface-2); color: var(--ink-3); }

.v-buono { color: var(--buono); }
.v-critico { color: var(--critico); }

/* Freccia di direzione accanto ai valori assoluti: il colore da solo non basta,
   circa un uomo su dodici non distingue rosso e verde. */
.legenda-colori span { font-weight: 600; }
.direzione { font-size: 9px; line-height: 1; width: 9px; text-align: center; color: var(--ink-3); }
table.tab-dati input.num.simulato.v-buono { color: var(--buono); border-color: color-mix(in srgb, var(--buono) 45%, var(--linea-forte)); background: color-mix(in srgb, var(--buono-tenue) 55%, var(--surface)); }
table.tab-dati input.num.simulato.v-critico { color: var(--critico); border-color: color-mix(in srgb, var(--critico) 45%, var(--linea-forte)); background: color-mix(in srgb, var(--critico-tenue) 55%, var(--surface)); }
table.tab-dati input.num.simulato.v-buono:focus, table.tab-dati input.num.simulato.v-critico:focus { background: var(--surface); }
.barra .metrica .val.v-buono, .barra .metrica .val.v-critico { font-weight: 600; }

.cursori { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 10px 18px; }
.cursore { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.cursore > .et { flex: 1 1 108px; min-width: 0; font-size: 12px; color: var(--ink-2); }
.cursore input[type="range"] { flex: 2 1 88px; min-width: 70px; accent-color: var(--accento); padding: 0; border: 0; background: none; }
.cursore .coppia { flex: 0 0 74px; }
.cursore .esito { flex: 0 0 80px; font-family: var(--mono); font-size: 11.5px; color: var(--ink-3); text-align: right; }
.riquadro-testo textarea {
  width: 100%; min-height: 180px; font-family: var(--mono); font-size: 11.5px;
  color: var(--ink); background: var(--surface-2); border: 1px solid var(--linea-forte);
  border-radius: 4px; padding: 8px; resize: vertical;
}

.griglia-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px; }

td.liv0 { font-weight: 600; }
td.liv1 { padding-left: 20px; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-2); }
td.liv2 { padding-left: 38px; color: var(--ink-2); }
tr.riga-totale td { background: color-mix(in srgb, var(--accento-tenue) 55%, transparent); font-weight: 600; border-top: 1px solid var(--linea-forte); }
tr.riga-margine td { background: var(--buono-tenue); font-weight: 600; }
td.fermo { color: var(--ink-3); }

.nota { font-size: 11.5px; color: var(--ink-3); margin: 8px 0 0; }
.nota code { font-family: var(--mono); font-size: 11px; }

.elenco-archivio { display: flex; flex-direction: column; gap: 0; }
.voce-archivio {
  display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; justify-content: space-between;
  padding: 9px 4px; border-bottom: 1px solid var(--linea);
}
.voce-archivio .id { display: flex; flex-direction: column; }
.voce-archivio .id b { font-weight: 600; }
.voce-archivio .id small { color: var(--ink-3); font-size: 11px; }
.vuoto { padding: 18px 4px; color: var(--ink-3); font-size: 13px; }

svg text { fill: var(--ink-2); font-family: var(--sans); }
svg .asse { stroke: var(--linea-forte); }
svg .griglia { stroke: var(--linea); }



@media print {
  .testa, .schede, .barra, .azioni, button { display: none !important; }
  main { padding: 0; padding-bottom: 0; }
  .pannello { break-inside: avoid; box-shadow: none; }
  body { background: #fff; }
}


/* --- allineamento delle tabelle di inserimento --- */
table.tab-fissa { table-layout: fixed; }
table.tab-fissa th, table.tab-fissa td { overflow: hidden; }

/* Ogni cella numerica: campo principale elastico più uno slot accessorio di larghezza
   fissa, presente anche vuoto. È lo slot vuoto a tenere in colonna righe con contenuti
   diversi (con lo sconto, con il suffisso, senza nulla). */
/* Il campo non si allunga oltre quello che serve a un importo: una casella larga mezzo
   schermo per sei cifre rende il numero difficile da trovare. Resta ancorato a destra,
   così le cifre di tutte le righe restano incolonnate. */
.coppia-valore { display: flex; align-items: center; justify-content: flex-end; gap: 4px; }
.coppia-valore .principale { flex: 0 1 138px; min-width: 0; }
.coppia-valore .accessorio {
  flex: 0 0 50px;
  display: flex; align-items: center; justify-content: flex-end; gap: 3px;
}
.coppia-valore .accessorio input.sconto { width: 36px; padding-left: 3px; padding-right: 3px; }
.coppia-valore .suff { font-size: 10px; color: var(--ink-3); width: 10px; text-align: left; }

/* Il numero è il contenuto della maschera: deve pesare più della sua etichetta. */
table.tab-dati input.num {
  font-size: 15px; font-weight: 500; color: var(--ink);
  letter-spacing: -.01em;
}
table.tab-dati input.num.sconto { font-size: 13px; font-weight: 400; }
table.tab-dati td.n[data-out] { font-size: 14.5px; font-weight: 500; color: var(--ink); }
table.tab-dati td.derivato[data-out] { color: var(--accento); }
table.tab-dati tr.somma td { font-size: 14.5px; }
table.tab-confronto td.n { font-size: 14px; font-weight: 500; color: var(--ink); }
table.tab-confronto tr.somma td.n { font-size: 15px; font-weight: 600; }
table.tab-incidenze td.n { font-size: 13.5px; font-weight: 400; }

/* Seconda riga della manodopera: subordinata, così non spezza il ritmo verticale. */
.riga-tariffa { display: flex; align-items: center; gap: 6px; margin-top: 3px; }
.riga-tariffa select {
  font-size: 11px; padding: 2px 4px; height: 22px;
  color: var(--ink-2); flex: 1 1 auto; min-width: 0;
}
.riga-tariffa button.commuta { flex: 0 0 auto; min-width: 26px; text-align: center; }
.riga-tariffa select { text-overflow: ellipsis; }
table.tab-dati td input:not(.sconto) { height: 28px; }

/* Allineamento in testa: una riga di manodopera è più alta perché porta la tariffa sotto
   il nome. Con le celle centrate, il campo numerico scenderebbe sotto il nome; ancorandole
   in alto, la prima riga di ogni cella parte dalla stessa quota. */
table.tab-dati td { vertical-align: top; padding-top: 4px; }
/* Solo le celle di solo testo scendono, per incolonnare la loro riga di testo con quella
   dentro i campi. Le celle che contengono un campo restano dove sono. */
table.tab-dati td.n[data-out], table.tab-dati tr.somma td:first-child { padding-top: 10px; }
table.tab-dati tr.cat td { padding-top: 4px; }
table.tab-dati td.azione-riga { padding-top: 8px; }

/* --- parametri spiegati --- */
.sotto-titolo {
  font-size: 11px; text-transform: uppercase; letter-spacing: .08em;
  color: var(--ink-2); margin: 0 0 6px;
}
.blocco-struttura {
  margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--linea);
}
.campo-spiegato { min-width: 0; }
.campo-spiegato .nota { max-width: 46ch; }
.valore-vivo {
  margin-top: 4px; font-size: 11px; color: var(--ink-3);
}
.valore-vivo b { font-family: var(--mono); color: var(--ink-2); font-weight: 500; }

/* --- scelta del livello di dettaglio --- */
.pannello-livello .corpo { padding-top: 10px; padding-bottom: 10px; }
.scelta-livello { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
.et-livello {
  font-size: 10px; text-transform: uppercase; letter-spacing: .09em; color: var(--ink-3); font-weight: 600;
}
.gruppo-bottoni { display: flex; flex-wrap: wrap; gap: 4px; }
button.espandi { border-style: dashed; color: var(--accento); border-color: var(--accento); }
button.espandi:hover { background: var(--accento-tenue); }
button.commuta {
  font-size: 10.5px; border: 1px solid var(--linea); border-radius: 99px;
  padding: 1px 8px; color: var(--ink-3);
}
button.commuta:hover { color: var(--accento); border-color: var(--accento); }
td.azione-riga, th.azione-riga { width: 34px; }

/* --- colonna simulata, scrivibile --- */
table.tab-dati input.num.simulato {
  color: var(--accento);
  font-weight: 600;
  border-color: color-mix(in srgb, var(--accento) 45%, var(--linea-forte));
  background: color-mix(in srgb, var(--accento-tenue) 45%, var(--surface));
}
table.tab-dati input.num.simulato:focus { background: var(--surface); }
table.tab-dati input.num.simulato::placeholder { color: var(--ink-3); font-weight: 400; }
table.tab-dati th:last-of-type, table.tab-dati th.n:nth-last-child(2) { color: var(--accento); }

.pannello-guida-colonne { border-left: 3px solid var(--accento); }
.pannello-guida-colonne .guida-elenco { margin-bottom: 6px; }
.pannello-guida-colonne dt { color: var(--accento); }

/* --- partire dal margine --- */
.riga-margine {
  display: flex; flex-wrap: wrap; gap: 10px 20px; align-items: flex-end;
}
.riga-margine label.campo { flex: 0 0 auto; }
.riga-margine label.campo input { width: 110px; }
.scelta-leva { display: flex; flex-direction: column; gap: 4px; }
.esito-margine {
  margin: 10px 0; padding: 9px 12px; border-radius: var(--r);
  font-size: 13.5px; line-height: 1.45;
  background: var(--surface-2); color: var(--ink);
  border-left: 3px solid var(--linea-forte);
}
.esito-margine.esito-sforzo { background: var(--attenzione-tenue); color: var(--attenzione); border-left-color: var(--attenzione); }
.esito-margine.esito-agio { background: var(--buono-tenue); color: var(--buono); border-left-color: var(--buono); }
.esito-margine.esito-nulla { background: var(--surface-2); color: var(--ink-3); border-left-color: var(--linea-forte); }

/* --- spiegazione del calcolo --- */
.spiegabile {
  cursor: help;
  border-bottom: 1px dashed var(--linea-forte);
  -webkit-tap-highlight-color: transparent;
}
.spiegabile.aperta { background: var(--accento-tenue); border-bottom-color: var(--accento); }
.spiegabile:focus-visible { outline: 2px solid var(--accento); outline-offset: 1px; }

#spiegazione {
  position: fixed;
  left: 50%;
  transform: translateX(-50%);
  bottom: calc(76px + env(safe-area-inset-bottom, 0px));
  z-index: 60;
  width: min(560px, calc(100% - 24px));
  background: var(--surface);
  border: 1px solid var(--accento);
  border-radius: 8px;
  box-shadow: 0 10px 34px rgba(23, 33, 44, .26);
  padding: 10px 12px;
}
.titolo-spiega {
  display: flex; justify-content: space-between; align-items: center; gap: 10px;
  font-weight: 600; font-size: 12.5px; margin-bottom: 5px;
}
.corpo-spiega {
  font-size: 12.5px; line-height: 1.5; color: var(--ink-2);
  font-variant-numeric: tabular-nums;
}

/* --- guida --- */
.guida p { margin: 0 0 10px; max-width: 68ch; }
.guida p:last-child { margin-bottom: 0; }
.guida-elenco { margin: 4px 0 10px; display: grid; grid-template-columns: minmax(130px, 200px) 1fr; gap: 6px 16px; }
.guida-elenco dt { font-weight: 600; font-size: 12.5px; }
.guida-elenco dd { margin: 0; color: var(--ink-2); font-size: 13px; max-width: 62ch; }

/* --- larghezza telefono --- */
@media (max-width: 700px) {
  main { padding: 12px; padding-bottom: 130px; }

  /* Le schede vanno a capo invece di scorrere: una scheda fuori vista è una scheda che
     l'operatore non sa di avere. */
  .schede { flex-wrap: wrap; overflow-x: visible; padding: 0 8px 4px; }
  .schede button { white-space: normal; padding: 9px 10px; }

  /* Testata compatta: su uno schermo alto 844 punti la sola intestazione non può
     prendersene 110. */
  .testa { padding: 8px 12px; gap: 6px 10px; }
  .marchio { flex: 1 1 100%; gap: 6px; }
  .marchio strong { font-size: 13.5px; }
  .marchio span { font-size: 9px; padding-left: 6px; }
  .testa .azioni { flex: 1 1 100%; }
  .testa .azioni button { flex: 1 1 auto; font-size: 12px; padding: 7px 8px; min-height: 36px; }
  .guida-elenco { grid-template-columns: 1fr; gap: 2px; }
  .guida-elenco dd { margin-bottom: 8px; }

  /* Le tabelle si ricompongono in blocchi verticali: ogni numero porta con sé la propria
     etichetta, così non serve mai scorrere di lato per leggere una cifra. */
  .tabellone { overflow-x: visible; }
  table.tab-confronto, table.tab-dati,
  table.tab-confronto tbody, table.tab-dati tbody,
  table.tab-confronto tr, table.tab-dati tr,
  table.tab-confronto td, table.tab-dati td { display: block; width: 100%; }
  table.tab-confronto thead, table.tab-dati thead { display: none; }

  table.tab-confronto tr, table.tab-dati tr {
    border: 1px solid var(--linea);
    border-radius: var(--r);
    padding: 7px 10px;
    margin-bottom: 8px;
    background: var(--surface);
  }
  table.tab-confronto td, table.tab-dati td {
    border: 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    padding: 3px 0;
    text-align: right;
    white-space: normal;
  }
  table.tab-confronto td::before, table.tab-dati td::before {
    content: attr(data-et);
    flex: 0 1 auto;
    text-align: left;
    color: var(--ink-3);
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: .07em;
    font-family: var(--sans);
    white-space: nowrap;
  }
  table.tab-confronto td:first-child, table.tab-dati td:first-child {
    display: block;

</style>
<script>
'use strict';

// ---- calcolo.mjs ----
// Motore di calcolo del simulatore di margine di commessa.
// Modulo puro: nessun accesso al DOM, nessuno stato globale, nessuna dipendenza.
// È il punto del sistema dove un errore costa di più, quindi vive separato ed è testato.

const COLONNE = ['preventivo', 'kom', 'simulato'];
const CATEGORIE = ['materiale', 'manodopera', 'altri'];

const ETICHETTA_COLONNA = {
  preventivo: 'Preventivo',
  kom: 'KOM',
  simulato: 'Simulato',
};

const ETICHETTA_CATEGORIA = {
  materiale: 'Materiale',
  manodopera: 'Manodopera',
  altri: 'Altri costi diretti',
};

const num = (v) => {
  const n = typeof v === 'number' ? v : parseFloat(String(v ?? '').replace(',', '.'));
  return Number.isFinite(n) ? n : 0;
};

// Le percentuali sono memorizzate come numeri leggibili (8 significa 8%).
// Internamente si lavora in frazioni.
const frazione = (v) => num(v) / 100;

/**
 * Come si inserisce una voce di manodopera. In ore per tariffa oraria quando la tariffa
 * aziendale è nota, ed è la forma che permette di simulare uno sforo di ore; a importo
 * quando si sta facendo una stima rapida e le tariffe non sono ancora state impostate.
 * Senza questa distinzione una riga di manodopera priva di tariffa costerebbe zero in
 * silenzio, che è il modo peggiore di sbagliare un margine.
 */
function modoManodopera(voce) {
  if (voce.modo === 'ore' || voce.modo === 'importo') return voce.modo;
  return voce.tariffaId ? 'ore' : 'importo';
}

/** Costo di una singola voce nella colonna indicata, prima degli scostamenti. */
function costoVoce(voce, colonna, tariffe) {
  const d = voce[colonna] || {};
  if (voce.cat === 'manodopera') {
    if (modoManodopera(voce) === 'importo') return num(d.q);
    const t = (tariffe || []).find((x) => x.id === voce.tariffaId);
    return num(d.q) * num(t && t.eurOra);
  }
  return num(d.q) * (1 - frazione(d.sconto));
}

/** Fattore moltiplicativo degli scostamenti applicabili a una voce. */
function fattoreVoce(sim, linea, voce) {
  const d = sim.delta || {};
  return (
    (1 + frazione(d.globale)) *
    (1 + frazione((d.linea || {})[linea.id])) *
    (1 + frazione((d.catLinea || {})[linea.id + '|' + voce.cat])) *
    (1 + frazione((d.voce || {})[voce.id]))
  );
}

/**
 * Su quale colonna poggia la simulazione. Normalmente il KOM, che è il budget di cui il PM
 * risponde. Se il KOM non è ancora stato compilato la simulazione poggia sul preventivo:
 * senza questo ripiego, chi compila solo il preventivo muove i cursori e non vede nulla,
 * perché moltiplicare zero per qualunque scostamento dà zero.
 */
function baseSimulato(sim) {
  const haKom = (sim.linee || []).some((l) => (
    num((l.ricavo || {}).kom) !== 0
    || (l.voci || []).some((v) => num((v.kom || {}).q) !== 0)
  ));
  return haKom ? 'kom' : 'preventivo';
}

/** Costo di una voce nella colonna simulato: colonna base moltiplicata per gli scostamenti. */
function costoVoceSimulato(sim, linea, voce, base) {
  return costoVoce(voce, base || baseSimulato(sim), sim.tariffe) * fattoreVoce(sim, linea, voce);
}

function ricavoLinea(sim, linea, colonna, base) {
  if (colonna !== 'simulato') return num((linea.ricavo || {})[colonna]);
  const d = sim.delta || {};
  return (
    num((linea.ricavo || {})[base]) *
    (1 + frazione(d.ricavo)) *
    (1 + frazione((d.ricavoLinea || {})[linea.id]))
  );
}

function costoDellaVoce(sim, linea, voce, colonna, base) {
  return colonna === 'simulato'
    ? costoVoceSimulato(sim, linea, voce, base)
    : costoVoce(voce, colonna, sim.tariffe);
}

const rapporto = (a, b) => (b !== 0 ? a / b : null);

/** Calcola una colonna completa: dettaglio per linea e totali di commessa. */
function calcolaColonna(sim, colonna) {
  const base = colonna === 'simulato' ? baseSimulato(sim) : colonna;
  const p = sim.parametri || {};
  const sg = frazione(p.sgPct);
  const ctg = frazione(p.ctgPct);
  const target = frazione(p.targetPct);

  const linee = (sim.linee || []).map((linea) => {
    const perCategoria = {};
    for (const cat of CATEGORIE) perCategoria[cat] = 0;
    const voci = {};
    for (const voce of linea.voci || []) {
      const c = costoDellaVoce(sim, linea, voce, colonna, base);
      perCategoria[voce.cat] = (perCategoria[voce.cat] || 0) + c;
      voci[voce.id] = c;
    }
    const cd = CATEGORIE.reduce((s, cat) => s + perCategoria[cat], 0);
    const r = ricavoLinea(sim, linea, colonna, base);
    const mdc = r - cd;
    return {
      id: linea.id,
      nome: linea.nome,
      perCategoria,
      voci,
      cd,
      ricavo: r,
      mdc,
      mdcPct: rapporto(mdc, r),
    };
  });

  const cd = linee.reduce((s, l) => s + l.cd, 0);
  const ricavo = linee.reduce((s, l) => s + l.ricavo, 0);
  const mdc = ricavo - cd;
  const speseGenerali = cd * sg;
  const contingency = cd * ctg;
  const mi = ricavo - cd - speseGenerali - contingency;

  // Costo massimo compatibile con il margine industriale obiettivo:
  // MI = R - CD(1+sg+ctg) >= target*R  =>  CD <= R(1-target)/(1+sg+ctg)
  const cdMax = (ricavo * (1 - target)) / (1 + sg + ctg);
  const riserva = cdMax - cd;

  return {
    colonna,
    base,
    linee,
    cd,
    ricavo,
    mdc,
    mdcPct: rapporto(mdc, ricavo),
    speseGenerali,
    contingency,
    mi,
    miPct: rapporto(mi, ricavo),
    cdMax,
    riserva,
    riservaPct: rapporto(riserva, cd),
  };
}

/**
 * Confronto fra due colonne. Restituisce le tre grandezze distinte che il documento
 * di proposta impone di non confondere: variazione assoluta in euro, variazione della
 * marginalità in punti percentuali, variazione relativa del margine in percentuale.
 */
function gap(a, b) {
  const pp = (x, y) => (x === null || y === null ? null : (y - x) * 100);
  // La variazione relativa non ha significato se il margine di partenza non è positivo.
  const rel = (x, y) => (x > 0 ? ((y - x) / x) * 100 : null);

  const effettoCostoPerLinea = b.linee.map((lb) => {
    const la = a.linee.find((x) => x.id === lb.id);
    const base = la || { cd: 0, ricavo: 0, perCategoria: {} };
    const perCategoria = {};
    for (const cat of CATEGORIE) {
      perCategoria[cat] = -((lb.perCategoria[cat] || 0) - (base.perCategoria[cat] || 0));
    }
    return {
      id: lb.id,
      nome: lb.nome,
      effettoRicavo: lb.ricavo - base.ricavo,
      effettoCosto: -(lb.cd - base.cd),
      perCategoria,
      dMdc: lb.mdc - (base.mdc || 0),
    };
  });

  return {
    da: a.colonna,
    a: b.colonna,
    dMdc: b.mdc - a.mdc,
    dMdcPp: pp(a.mdcPct, b.mdcPct),
    dMdcRel: rel(a.mdc, b.mdc),
    dMi: b.mi - a.mi,
    dMiPp: pp(a.miPct, b.miPct),
    dMiRel: rel(a.mi, b.mi),
    dRicavo: b.ricavo - a.ricavo,
    dCd: b.cd - a.cd,
    effettoRicavo: b.ricavo - a.ricavo,
    effettoCosto: -(b.cd - a.cd),
    perLinea: effettoCostoPerLinea,
  };
}

/** Calcolo completo: le tre colonne e i due gap. */
function calcola(sim) {
  const colonne = {};
  for (const c of COLONNE) colonne[c] = calcolaColonna(sim, c);
  return {
    colonne,
    baseSimulazione: baseSimulato(sim),
    gapPreventivoKom: gap(colonne.preventivo, colonne.kom),
    gapKomSimulato: gap(colonne.kom, colonne.simulato),
  };
}

/**
 * Sensitività: impatto sul margine industriale simulato di una variazione del driver,
 * tenendo fermi gli altri. Ordinato per impatto decrescente (tornado).
 */
function sensitivita(sim, ampiezzaPct = 10, livello = 'voce') {
  const driver = [];
  for (const linea of sim.linee || []) {
    if (livello === 'voce') {
      for (const voce of linea.voci || []) {
        if (costoVoce(voce, baseSimulato(sim), sim.tariffe) === 0) continue;
        driver.push({
          campo: 'voce',
          chiave: voce.id,
          etichetta: (voce.nome || 'senza nome') + ' · ' + linea.nome,
        });
      }
      continue;
    }
    for (const cat of CATEGORIE) {
      const chiave = linea.id + '|' + cat;
      const haVoci = (linea.voci || []).some((v) => v.cat === cat);
      if (haVoci) driver.push({ campo: 'catLinea', chiave, etichetta: linea.nome + ' · ' + ETICHETTA_CATEGORIA[cat] });
    }
  }
  const partenza = calcolaColonna(sim, 'simulato').mi;
  const righe = driver.map((d) => {
    const campo = d.campo || 'catLinea';
    const conDelta = (segno) => {
      const clone = {
        ...sim,
        delta: {
          ...(sim.delta || {}),
          [campo]: {
            ...((sim.delta || {})[campo] || {}),
            [d.chiave]: num(((sim.delta || {})[campo] || {})[d.chiave]) + segno * ampiezzaPct,
          },
        },
      };
      return calcolaColonna(clone, 'simulato').mi;
    };
    const su = conDelta(1) - partenza;
    const giu = conDelta(-1) - partenza;
    return { ...d, su, giu, ampiezza: Math.abs(su - giu) };
  });
  righe.sort((x, y) => y.ampiezza - x.ampiezza);
  return { base: partenza, ampiezzaPct, righe };
}

const RIFERIMENTI_INCIDENZA = {
  cd: 'Costi diretti',
  ricavo: 'Ricavo',
};

/**
 * Peso di ogni voce sul totale, colonna per colonna, e sua variazione fra le colonne.
 *
 * Il riferimento cambia la domanda a cui si risponde, e le due letture non sono
 * intercambiabili:
 *  - 'cd'     quanto pesa la voce sui costi diretti. Descrive la composizione del costo.
 *             Uno scostamento uniforme su tutte le voci non la muove di un punto.
 *  - 'ricavo' quanto pesa la voce sul ricavo. Descrive quanto della commessa se ne va in
 *             quella voce, e si muove per qualunque scostamento. Sommata al margine di
 *             contribuzione fa 100%.
 *
 * Restituisce righe piatte già ordinate e annidate (livello 0 linea, 1 categoria, 2 voce),
 * pronte per essere stampate, così l'interfaccia non deve ricostruire la gerarchia.
 */
function incidenze(sim, risultato, riferimento = 'cd') {
  const denom = (col) => (riferimento === 'ricavo' ? col.ricavo : col.cd);
  const quota = (valore, col) => {
    const d = denom(col);
    return d ? valore / d : null;
  };
  const perColonna = (fn) => {
    const o = {};
    for (const c of COLONNE) o[c] = fn(risultato.colonne[c]);
    return o;
  };
  const pp = (a, b) => (a === null || b === null ? null : (b - a) * 100);
  const conDelta = (valori) => ({
    valori,
    dPreventivoKom: pp(valori.preventivo, valori.kom),
    dKomSimulato: pp(valori.kom, valori.simulato),
  });

  const righe = [];
  for (const linea of sim.linee || []) {
    const perLinea = (col) => {
      const l = col.linee.find((x) => x.id === linea.id);
      return l ? quota(l.cd, col) : null;
    };
    righe.push({ livello: 0, tipo: 'linea', id: linea.id, nome: linea.nome || 'Linea', ...conDelta(perColonna(perLinea)) });

    for (const cat of CATEGORIE) {
      const voci = (linea.voci || []).filter((v) => v.cat === cat);
      if (voci.length === 0) continue;
      const perCat = (col) => {
        const l = col.linee.find((x) => x.id === linea.id);
        return l ? quota(l.perCategoria[cat] || 0, col) : null;
      };
      righe.push({ livello: 1, tipo: 'categoria', id: linea.id + '|' + cat, nome: ETICHETTA_CATEGORIA[cat], ...conDelta(perColonna(perCat)) });

      for (const voce of voci) {
        const perVoce = (col) => {
          const l = col.linee.find((x) => x.id === linea.id);
          return l ? quota(l.voci[voce.id] || 0, col) : null;
        };
        righe.push({ livello: 2, tipo: 'voce', id: voce.id, nome: voce.nome || 'senza nome', ...conDelta(perColonna(perVoce)) });
      }
    }
  }

  righe.push({
    livello: 0, tipo: 'totale', id: '_cd', nome: 'Totale costi diretti',
    ...conDelta(perColonna((col) => quota(col.cd, col))),
  });
  if (riferimento === 'ricavo') {
    righe.push({
      livello: 0, tipo: 'margine', id: '_mdc', nome: 'Margine di contribuzione',
      ...conDelta(perColonna((col) => quota(col.mdc, col))),
    });
  }
  return { riferimento, righe };
}

const LEVE = {
  costi: 'Costi',
  ricavi: 'Ricavi',
};

/**
 * Calcolo inverso: dato il margine che si vuole raggiungere, quale scostamento serve.
 *
 * Il margine di riferimento è quello industriale, che coincide con il margine di
 * contribuzione quando costi di struttura e riserva sono a zero:
 *   MI = R - CD(1+k),  con k = struttura + riserva
 *   MI/R = m  =>  CD(1+k) = R(1-m)
 *
 * Agendo sui costi, il ricavo resta quello simulato e si cerca CD; agendo sui ricavi,
 * restano i costi e si cerca R. Il risultato è uno scostamento percentuale complessivo,
 * cioè la stessa leva che il PM muove a mano: resta visibile, modificabile e annullabile.
 */
function scostamentoPerMargine(sim, marginePct, leva) {
  const m = frazione(marginePct);
  const p = sim.parametri || {};
  const k = frazione(p.sgPct) + frazione(p.ctgPct);
  const attuale = calcolaColonna(sim, 'simulato');

  const senza = (campo) => calcolaColonna(
    { ...sim, delta: { ...(sim.delta || {}), [campo]: 0 } },
    'simulato',
  );

  if (m >= 1) {
    return { possibile: false, motivo: 'Un margine del 100% o più non è raggiungibile.' };
  }

  if (leva === 'costi') {
    if (!(attuale.ricavo > 0)) {
      return { possibile: false, motivo: 'Serve un ricavo maggiore di zero per calcolare i costi ammessi.' };
    }
    const base = senza('globale').cd;
    if (!(base > 0)) {
      return { possibile: false, motivo: 'Serve almeno un costo inserito su cui agire.' };
    }
    const richiesto = (attuale.ricavo * (1 - m)) / (1 + k);
    return {
      possibile: true,
      leva: 'costi',
      deltaPct: (richiesto / base - 1) * 100,
      attuale: attuale.cd,
      richiesto,
      variazione: richiesto - attuale.cd,
      negativo: richiesto < 0,
    };
  }

  if (!(attuale.cd > 0)) {
    return { possibile: false, motivo: 'Serve almeno un costo inserito per calcolare il ricavo necessario.' };
  }
  const base = senza('ricavo').ricavo;
  if (!(base > 0)) {
    return { possibile: false, motivo: 'Serve un ricavo di partenza maggiore di zero su cui agire.' };
  }
  const richiesto = (attuale.cd * (1 + k)) / (1 - m);
  return {
    possibile: true,
    leva: 'ricavi',
    deltaPct: (richiesto / base - 1) * 100,
    attuale: attuale.ricavo,
    richiesto,
    variazione: richiesto - attuale.ricavo,
    negativo: false,
  };
}

/**
 * Costo della voce nella colonna simulata con tutti gli scostamenti applicati tranne
 * quello della voce stessa. È il punto di partenza per fare il percorso inverso: se
 * l'utente scrive direttamente quanto vuole che costi quella voce, da qui si ricava lo
 * scostamento che produce quel numero.
 */
function costoVoceSenzaScostamentoProprio(sim, linea, voce) {
  const d = sim.delta || {};
  const f = (1 + frazione(d.globale))
    * (1 + frazione((d.linea || {})[linea.id]))
    * (1 + frazione((d.catLinea || {})[linea.id + '|' + voce.cat]));
  return costoVoce(voce, baseSimulato(sim), sim.tariffe) * f;
}

/** Ricavo della linea nella colonna simulata senza lo scostamento proprio della linea. */
function ricavoSenzaScostamentoProprio(sim, linea) {
  const d = sim.delta || {};
  return num((linea.ricavo || {})[baseSimulato(sim)]) * (1 + frazione(d.ricavo));
}

/**
 * Scostamento da scrivere perché una grandezza assuma il valore voluto.
 * Restituisce null quando il valore di partenza è zero: da zero nessun fattore
 * moltiplicativo porta a un numero diverso da zero, e fingere il contrario darebbe
 * un campo che accetta quello che scrivi e non lo rispetta.
 */
function scostamentoPerValore(partenza, voluto) {
  if (!(Math.abs(partenza) > 1e-9)) return null;
  return (num(voluto) / partenza - 1) * 100;
}


// ---- modello.mjs ----
// Modello dati della simulazione: valori di default, voci suggerite, serializzazione.
// Separato dal motore di calcolo perché qui vivono le convenzioni aziendali, che cambiano,
// mentre le formule no.

const VERSIONE_SCHEMA = 1;

let contatore = 0;
function id(prefisso = 'x') {
  contatore += 1;
  return prefisso + '-' + Date.now().toString(36) + '-' + contatore.toString(36);
}

/** Tipi di manodopera con tariffa oraria centralizzata. Le tariffe partono vuote di proposito. */
const TARIFFE_DEFAULT = [
  'Produzione e cablaggio',
  'Ingegneria elettrica',
  'Ingegneria software',
  'Montaggio in cantiere',
  'Messa in servizio',
  'Project management',
];

/** Voci suggerite nel menu "aggiungi", per categoria. L'elenco è un aiuto, non un vincolo. */
const SUGGERIMENTI = {
  materiale: [
    'ABB', 'Siemens', 'Schneider', 'Rittal', 'Phoenix Contact', 'Weidmuller',
    'Componenti elettrici', 'Carpenteria e quadro', 'Cavi', 'Minuteria',
    'Strumentazione', 'Materiale di installazione', 'Altro materiale',
  ],
  manodopera: TARIFFE_DEFAULT,
  altri: [
    'Trasferte e viaggi', 'Vitto e alloggio', 'Noleggi', 'Trasporti e logistica',
    'Subappalti e terzisti', 'Collaudi e certificazioni', 'Attrezzature di cantiere',
    'Sicurezza e DPI', 'Altro costo diretto',
  ],
};

const NOMI_LINEE = ['Quadri elettrici', 'Installazione cantiere', 'Commissioning'];

const ETICHETTA_CAT = {
  materiale: 'Materiale',
  manodopera: 'Manodopera',
  altri: 'Altri costi diretti',
};

function nuovaVoce(cat, nome, tariffe) {
  const v = {
    id: id('v'),
    cat,
    nome,
    preventivo: { q: 0, sconto: 0 },
    kom: { q: 0, sconto: 0 },
  };
  if (cat === 'manodopera') {
    const t = (tariffe || []).find((x) => x.nome === nome);
    v.tariffaId = t ? t.id : null;
    v.modo = t ? 'ore' : 'importo';
  }
  return v;
}

function nuovaTariffa(nome, eurOra = 0) {
  return { id: id('t'), nome, eurOra };
}

function nuovaLinea(nome) {
  return { id: id('l'), nome, ricavo: { preventivo: 0, kom: 0 }, voci: [] };
}

/**
 * Struttura minima di una linea: una sola voce per categoria. È il livello a cui si parte,
 * dove per compilare una commessa bastano nove numeri in tutto. Il dettaglio per marca e
 * per tipo di manodopera si aggiunge dopo, se serve.
 */
function lineaStandard(nome, tariffe) {
  const l = nuovaLinea(nome);
  l.voci = ['materiale', 'manodopera', 'altri'].map((c) => nuovaVoce(c, ETICHETTA_CAT[c], tariffe));
  return l;
}

function nomiLineeStandard() {
  return NOMI_LINEE.slice();
}

function nuovaSimulazione() {
  const tariffe = TARIFFE_DEFAULT.map((n) => nuovaTariffa(n, 0));
  return {
    versione: VERSIONE_SCHEMA,
    meta: {
      codice: '',
      cliente: '',
      descrizione: '',
      data: new Date().toISOString().slice(0, 10),
      autore: '',
      note: '',
    },
    parametri: { sgPct: 0, ctgPct: 0, targetPct: 0, validitaTariffe: '' },
    tariffe,
    linee: NOMI_LINEE.map((n) => lineaStandard(n, tariffe)),
    delta: { ricavo: 0, ricavoLinea: {}, globale: 0, linea: {}, catLinea: {}, voce: {} },
  };
}

/** Normalizza una simulazione caricata da file, tollerando campi mancanti. */
function normalizza(raw) {
  const base = nuovaSimulazione();
  if (!raw || typeof raw !== 'object') return base;
  const sim = {
    versione: VERSIONE_SCHEMA,
    meta: { ...base.meta, ...(raw.meta || {}) },
    parametri: { ...base.parametri, ...(raw.parametri || {}) },
    tariffe: Array.isArray(raw.tariffe) && raw.tariffe.length ? raw.tariffe : base.tariffe,
    linee: Array.isArray(raw.linee) ? raw.linee : base.linee,
    delta: { ...base.delta, ...(raw.delta || {}) },
  };
  sim.linee = sim.linee.map((l) => ({
    id: l.id || id('l'),
    nome: l.nome || 'Servizio',
    ricavo: { preventivo: 0, kom: 0, ...(l.ricavo || {}) },
    voci: (l.voci || []).map((v) => {
      const voce = {
        id: v.id || id('v'),
        cat: v.cat || 'materiale',
        nome: v.nome || 'Voce',
        tariffaId: v.tariffaId ?? null,
        preventivo: { q: 0, sconto: 0, ...(v.preventivo || {}) },
        kom: { q: 0, sconto: 0, ...(v.kom || {}) },
      };
      if (voce.cat === 'manodopera') {
        voce.modo = v.modo === 'ore' || v.modo === 'importo' ? v.modo : (voce.tariffaId ? 'ore' : 'importo');
      }
      return voce;
    }),
  }));
  return sim;
}

/** Nome file dell'archivio: leggibile, ordinabile, senza caratteri problematici. */
function nomeFile(sim) {
  const pulisci = (s) => String(s || '').trim().replace(/[^\w\s-]/g, '').replace(/\s+/g, '-').slice(0, 40);
  const codice = pulisci(sim.meta.codice) || 'senza-codice';
  const d = new Date();
  const p = (n) => String(n).padStart(2, '0');
  const stamp = `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}`;
  return `${codice}_${stamp}.json`;
}

// Persistenza dell'archivio delle simulazioni.
//
// Tre livelli, in ordine di robustezza:
//   1. cartella di rete scelta dall'utente (File System Access API, Chrome ed Edge)
//   2. memoria del browser, come ripiego dichiarato all'utente
//   3. file singolo scaricato o aperto a mano, sempre disponibile
//
// La memoria del browser non è un archivio: è agganciata al browser e al percorso della
// pagina, e sparisce con la pulizia dei dati di navigazione. L'interfaccia lo dice.


const CHIAVE_ARCHIVIO = 'sm.archivio.v1';
const CHIAVE_BOZZA = 'sm.bozza.v1';
const DB = 'simulatore-margine';
const STORE = 'handle';

function supportaCartella() {
  return typeof globalThis.showDirectoryPicker === 'function';
}

/** I download partono solo se la pagina non è in un contenitore che li blocca. */
function supportaDownload() {
  try {
    const a = document.createElement('a');
    return typeof a.download === 'string' && typeof URL.createObjectURL === 'function';
  } catch { return false; }
}

function conMemoria(fn, ripiego = null) {
  try { return fn(); } catch { return ripiego; }
}

// --- memoria del browser -----------------------------------------------------------

function leggiMappa() {
  return conMemoria(() => JSON.parse(localStorage.getItem(CHIAVE_ARCHIVIO) || '{}'), {}) || {};
}
function scriviMappa(m) {
  return conMemoria(() => { localStorage.setItem(CHIAVE_ARCHIVIO, JSON.stringify(m)); return true; }, false);
}

function salvaBozza(sim) {
  conMemoria(() => localStorage.setItem(CHIAVE_BOZZA, JSON.stringify(sim)));
}
function leggiBozza() {
  const raw = conMemoria(() => localStorage.getItem(CHIAVE_BOZZA), null);
  if (!raw) return null;
  try { return normalizza(JSON.parse(raw)); } catch { return null; }
}
function scartaBozza() {
  conMemoria(() => localStorage.removeItem(CHIAVE_BOZZA));
}

// --- cartella ----------------------------------------------------------------------

function apriDb() {
  return new Promise((ris, rif) => {
    const r = indexedDB.open(DB, 1);
    r.onupgradeneeded = () => r.result.createObjectStore(STORE);
    r.onsuccess = () => ris(r.result);
    r.onerror = () => rif(r.error);
  });
}

async function scriviHandle(h) {
  const db = await apriDb();
  return new Promise((ris, rif) => {
    const tx = db.transaction(STORE, 'readwrite');
    tx.objectStore(STORE).put(h, 'cartella');
    tx.oncomplete = () => ris(true);
    tx.onerror = () => rif(tx.error);
  });
}

async function leggiHandle() {
  const db = await apriDb();
  return new Promise((ris) => {
    const tx = db.transaction(STORE, 'readonly');
    const r = tx.objectStore(STORE).get('cartella');
    r.onsuccess = () => ris(r.result || null);
    r.onerror = () => ris(null);
  });
}

let cartella = null;

function cartellaAttiva() { return cartella; }

/** Ricollega la cartella già scelta, se il permesso è ancora concesso senza chiedere nulla. */
async function ripristinaCartella() {
  if (!supportaCartella()) return null;
  const h = await conMemoria(() => leggiHandle(), null);
  if (!h) return null;
  try {
    const stato = await h.queryPermission({ mode: 'readwrite' });
    if (stato === 'granted') { cartella = h; return h; }
  } catch { /* handle non più valido */ }
  return null;
}

async function scegliCartella() {
  const h = await globalThis.showDirectoryPicker({ mode: 'readwrite', id: 'archivio-margine' });
  const stato = await h.requestPermission({ mode: 'readwrite' });
  if (stato !== 'granted') throw new Error('Permesso di scrittura non concesso sulla cartella.');
  cartella = h;
  await conMemoria(() => scriviHandle(h));
  return h;
}

function staccaCartella() { cartella = null; }

// --- API unica dell'archivio -------------------------------------------------------

function modo() { return cartella ? 'cartella' : 'browser'; }

function sintesi(nome, sim) {
  return {
    nome,
    codice: sim.meta?.codice || '(senza codice)',
    cliente: sim.meta?.cliente || '',
    data: sim.meta?.data || '',
    descrizione: sim.meta?.descrizione || '',
    sim,
  };
}

async function elenca() {
  if (cartella) {
    const voci = [];
    for await (const [nome, h] of cartella.entries()) {
      if (!nome.toLowerCase().endsWith('.json') || h.kind !== 'file') continue;
      try {
        const testo = await (await h.getFile()).text();
        voci.push(sintesi(nome, normalizza(JSON.parse(testo))));
      } catch { /* file non leggibile: si ignora senza interrompere l'elenco */ }
    }
    return voci.sort((a, b) => b.nome.localeCompare(a.nome));
  }
  const m = leggiMappa();
  return Object.entries(m)
    .map(([nome, sim]) => sintesi(nome, normalizza(sim)))
    .sort((a, b) => b.nome.localeCompare(a.nome));
}

async function salva(sim) {
  const nome = nomeFile(sim);
  const testo = JSON.stringify(sim, null, 2);
  if (cartella) {
    const h = await cartella.getFileHandle(nome, { create: true });
    const w = await h.createWritable();
    await w.write(testo);
    await w.close();
    return { nome, modo: 'cartella' };
  }
  const m = leggiMappa();
  m[nome] = sim;
  if (!scriviMappa(m)) throw new Error('La memoria del browser non è disponibile o è piena.');
  return { nome, modo: 'browser' };
}

async function elimina(nome) {
  if (cartella) { await cartella.removeEntry(nome); return; }
  const m = leggiMappa();
  delete m[nome];
  scriviMappa(m);
}

// --- file singolo ------------------------------------------------------------------

function testoDi(sim) { return JSON.stringify(sim, null, 2); }

function scarica(sim) {
  const testo = testoDi(sim);
  const blob = new Blob([testo], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = nomeFile(sim);
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

function apriFile() {
  return new Promise((ris, rif) => {
    const inp = document.createElement('input');
    inp.type = 'file';
    inp.accept = 'application/json,.json';
    inp.onchange = () => {
      const f = inp.files && inp.files[0];
      if (!f) return rif(new Error('Nessun file selezionato.'));
      const fr = new FileReader();
      fr.onload = () => {
        try { ris(normalizza(JSON.parse(String(fr.result)))); }
        catch { rif(new Error('Il file non contiene una simulazione valida.')); }
      };
      fr.onerror = () => rif(new Error('Lettura del file non riuscita.'));
      fr.readAsText(f);
    };
    inp.click();
  });
}

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];

function h(tag, attrs = {}, ...figli) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === null || v === undefined || v === false) continue;
    if (k === 'class') n.className = v;
    else if (k === 'testo') n.textContent = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v === true ? '' : String(v));
  }
  for (const f of figli.flat()) {
    if (f === null || f === undefined || f === false) continue;
    n.appendChild(typeof f === 'string' || typeof f === 'number' ? document.createTextNode(String(f)) : f);
  }
  return n;
}

const nfEuro = new Intl.NumberFormat('it-IT', { style: 'currency', currency: 'EUR', maximumFractionDigits: 0 });
const nfEuro2 = new Intl.NumberFormat('it-IT', { maximumFractionDigits: 0 });

const euro = (n) => nfEuro.format(Number.isFinite(n) ? n : 0);
const numero = (n) => nfEuro2.format(Number.isFinite(n) ? n : 0);
const perc = (f) => (f === null || f === undefined || !Number.isFinite(f) ? 'n.d.' : (f * 100).toFixed(1).replace('.', ',') + '%');
const segno = (v, s) => (v > 0 ? '+' : '') + s;
const euroSegnato = (n) => segno(n, euro(n));
const punti = (v) => (v === null || !Number.isFinite(v) ? 'n.d.' : segno(v, v.toFixed(1).replace('.', ',')) + ' p.p.');
const percRel = (v) => (v === null || !Number.isFinite(v) ? 'n.d.' : segno(v, v.toFixed(1).replace('.', ',')) + '%');

/** Accetta 1234,56 oppure 1.234,56 oppure 1234.56 senza indovinare a caso. */
function leggiNumero(s) {
  const t = String(s ?? '').trim().replace(/\s/g, '');
  if (!t) return 0;
  let n;
  if (t.includes(',')) n = parseFloat(t.replace(/\./g, '').replace(',', '.'));
  else if (/^-?\d{1,3}(\.\d{3})+$/.test(t)) n = parseFloat(t.replace(/\./g, ''));
  else n = parseFloat(t);
  return Number.isFinite(n) ? n : 0;
}

function imposta(percorso, valore) {
  const parti = percorso.split('.');
  let o = sim;
  for (let i = 0; i < parti.length - 1; i += 1) {
    if (o[parti[i]] === null || typeof o[parti[i]] !== 'object') o[parti[i]] = {};
    o = o[parti[i]];
  }
  o[parti[parti.length - 1]] = valore;
}

function classeMargine(f, target) {
  if (f === null || !Number.isFinite(f)) return 'p-neutro';
  if (target > 0) {
    if (f >= target) return 'p-buono';
    if (f >= target * 0.8) return 'p-attenzione';
    return 'p-critico';
  }
  if (f >= 0.15) return 'p-buono';
  if (f >= 0) return 'p-attenzione';
  return 'p-critico';
}

function avvisa(testo, azione = null) {
  messaggio = testo ? { testo, azione } : null;

  if (testo) {

    setTimeout(() => {
      if (messaggio && messaggio.testo === testo) { messaggio = null; disegnaMessaggio(); }
    }, durata);
  }
}

function disegnaMessaggio() {

 */
function conAnnulla(descrizione, azione) {

/**
 * Larghezze di colonna deterministiche. Senza, ogni tabella si dimensiona sul proprio
 * contenuto e le colonne di due linee di servizio non si allineano fra loro; dentro la
 * stessa colonna, una riga con lo sconto e una senza finiscono con l'input di larghezza
 * diversa e il bordo destro sfalsato.
 */
const L_VOCE = 300;
const L_VALORE = 200;
const L_AZIONE = 48;

function colonneTabella(nValori, conAzione) {
  // Percentuali ricavate dalle larghezze di riferimento: con le percentuali la tabella
  // si restringe insieme alla finestra, con i pixel resterebbe rigida e finirebbe per
  // uscire dallo schermo.
  const totale = larghezzaTabella(nValori, conAzione);
  const q = (px) => ((px / totale) * 100).toFixed(3) + '%';
  return h('colgroup', {},
    h('col', { style: `width:${q(L_VOCE)}` }),
    ...Array.from({ length: nValori + 1 }, () => h('col', { style: `width:${q(L_VALORE)}` })),
    conAzione ? h('col', { style: `width:${q(L_AZIONE)}` }) : null);
}

/** Oltre questa larghezza la tabella smette di allargarsi: le colonne non hanno nulla da
 *  farci con lo spazio in più, e il numero finirebbe lontano dalla voce a cui si riferisce. */
function larghezzaTabella(nValori, conAzione) {
  return L_VOCE + L_VALORE * (nValori + 1) + (conAzione ? L_AZIONE : 0);
}

/**
 * Ogni cella numerica ha la stessa struttura: un campo principale che occupa lo spazio
 * disponibile e uno slot accessorio di larghezza fissa, presente anche quando è vuoto.
 * È lo slot vuoto a tenere allineate fra loro righe che hanno contenuti diversi.
 */
/**
 * Cella della colonna Simulato, scrivibile. È qui che si simula: si scrive quanto si vuole
 * che quella voce costi e lo strumento ricava da sé lo scostamento che produce quel
 * numero. Prima questa colonna era di sola lettura e l'unico modo di simulare erano i
 * cursori in un'altra scheda, che è il motivo per cui non si capiva dove mettere i valori.
 */
function cellaSimulataVoce(linea, voce) {
  const campo = h('input', {
    type: 'text', inputmode: 'decimal', class: 'num principale simulato',
    'data-out': 'voce:' + voce.id,
    placeholder: '\u2014',
    'aria-label': 'Costo simulato di ' + (voce.nome || 'questa voce'),
    oninput: (e) => {
      if (!sim.delta.voce) sim.delta.voce = {};
      const testo = e.target.value.trim();
      if (testo === '') { delete sim.delta.voce[voce.id]; aggiornaDerivati(); return; }
      const partenza = costoVoceSenzaScostamentoProprio(sim, linea, voce);
      const d = scostamentoPerValore(partenza, leggiNumero(testo));
      if (d === null) {
        avvisa('Questa voce parte da zero: inserisci prima un valore nella colonna ' + ETICHETTA_COLONNA[baseSimulato(sim)] + '.');
        return;
      }
      sim.delta.voce[voce.id] = d;
      aggiornaDerivati();
    },
  });
  return h('td', { class: 'n', 'data-et': 'Simulato' },
    h('div', { class: 'coppia coppia-valore' },
      campo,
      h('span', { class: 'accessorio' },
        h('span', { class: 'direzione' }),
        h('span', { class: 'suff', testo: '\u20ac' }))));
}

/** Stessa logica per il ricavo del servizio. */
function cellaSimulataRicavo(linea) {
  const campo = h('input', {
    type: 'text', inputmode: 'decimal', class: 'num principale simulato',
    'data-out': 'ricavo:' + linea.id,
    placeholder: '\u2014',
    'aria-label': 'Ricavo simulato di ' + (linea.nome || 'questo servizio'),
    oninput: (e) => {
      if (!sim.delta.ricavoLinea) sim.delta.ricavoLinea = {};
      const testo = e.target.value.trim();
      if (testo === '') { delete sim.delta.ricavoLinea[linea.id]; aggiornaDerivati(); return; }
      const partenza = ricavoSenzaScostamentoProprio(sim, linea);
      const d = scostamentoPerValore(partenza, leggiNumero(testo));
      if (d === null) {
        avvisa('Questo servizio parte da ricavo zero: inseriscilo prima nella colonna ' + ETICHETTA_COLONNA[baseSimulato(sim)] + '.');
        return;
      }
      sim.delta.ricavoLinea[linea.id] = d;
      aggiornaDerivati();
    },
  });
  return h('td', { class: 'n', 'data-et': 'Simulato' },
    h('div', { class: 'coppia coppia-valore' },
      campo,
      h('span', { class: 'accessorio' },
        h('span', { class: 'direzione' }),
        h('span', { class: 'suff', testo: '\u20ac' }))));
}

function cellaValore(voce, colonna, percorsoBase) {
  const accessorio = (...figli) => h('span', { class: 'accessorio' }, ...figli);
  let dentro;

  if (voce.cat === 'manodopera') {
    const ore = modoManodopera(voce) === 'ore';
    dentro = [
      inputNumero(`${percorsoBase}.${colonna}.q`, voce[colonna].q, { class: 'num principale', placeholder: '0' }),
      accessorio(h('span', { class: 'suff', testo: ore ? 'h' : '\u20ac' })),
    ];
  } else if (voce.cat === 'materiale') {
    dentro = [
      inputNumero(`${percorsoBase}.${colonna}.q`, voce[colonna].q, { class: 'num principale', placeholder: 'listino', title: 'Importo di listino' }),
      accessorio(
        inputNumero(`${percorsoBase}.${colonna}.sconto`, voce[colonna].sconto, { class: 'num sconto', placeholder: '0', title: 'Sconto percentuale sul listino' }),
        h('span', { class: 'suff', testo: '%' })),
    ];
  } else {
    dentro = [
      inputNumero(`${percorsoBase}.${colonna}.q`, voce[colonna].q, { class: 'num principale', placeholder: '0' }),
      accessorio(h('span', { class: 'suff', testo: '\u20ac' })),
    ];
  }

  return h('td', { class: 'n', 'data-et': ETICHETTA_COLONNA[colonna] },
    h('div', { class: 'coppia coppia-valore' }, ...dentro));
}

/** Cella di sola lettura con lo stesso impianto, per restare allineata alle celle editabili. */
function cellaRicavo(percorso, valore, colonna) {
  return h('td', { class: 'n', 'data-et': ETICHETTA_COLONNA[colonna] },
    h('div', { class: 'coppia coppia-valore' },

    })));

function cursore(etichetta, percorso, valore, uscita) {
  const nInput = h('input', {
    type: 'text', inputmode: 'decimal', class: 'num', value: String(valore ?? 0).replace('.', ','),
    oninput: (e) => {
      const v = leggiNumero(e.target.value);
      imposta(percorso, v);
      range.value = Math.max(-60, Math.min(60, v));
      aggiornaDerivati();
    },
  });
  const range = h('input', {
    type: 'range', min: -60, max: 60, step: 1, value: Math.max(-60, Math.min(60, valore ?? 0)),
    'aria-label': etichetta,
    oninput: (e) => {
      const v = Number(e.target.value);
      imposta(percorso, v);
      nInput.value = String(v).replace('.', ',');
      aggiornaDerivati();
    },
  });
  return h('div', { class: 'cursore' },
    h('div', { class: 'et', testo: etichetta, title: etichetta }),
    range,
    h('div', { class: 'coppia' }, nInput, h('span', { class: 'suff', testo: '%' })),
    uscita ? h('div', { class: 'esito', 'data-out': uscita, testo: '—' }) : null);
}

/**
 * Terza via di simulazione, oltre a costi e ricavi: si parte dal margine che si vuole
 * ottenere e lo strumento dice quale scostamento serve. Il risultato non è una risposta
 * chiusa: diventa uno scostamento normale, visibile nei cursori, modificabile e
 * annullabile come se fosse stato inserito a mano.
 */
function pannelloMargine() {
  const valore = margineVoluto === null ? (sim.parametri.targetPct || 0) : margineVoluto;

  const applica = () => {
    const r = scostamentoPerMargine(sim, valore, levaMargine);
    if (!r.possibile) { avvisa(r.motivo); return; }
    const campo = levaMargine === 'costi' ? 'globale' : 'ricavo';
    // Arrotondato al centesimo di punto: un cursore con quindici decimali non si legge e
    // non si ritocca, e sul margine la differenza è sotto il decimo di punto.
    const scostamento = Math.round(r.deltaPct * 100) / 100;
    conAnnulla(
      `Applicato ${percRel(scostamento)} su ${levaMargine === 'costi' ? 'tutti i costi' : 'tutti i ricavi'} per raggiungere il ${perc(valore / 100)}.`,
      () => { sim.delta = { ...(sim.delta || {}), [campo]: scostamento }; },
    );
  };

  return h('section', { class: 'pannello' },
    h('h2', { testo: 'Partire dal margine' }),
    h('div', { class: 'corpo' },
      h('div', { class: 'riga-margine' },
        h('label', { class: 'campo' },
          h('span', { testo: 'Margine da raggiungere %' }),
          h('input', {
            type: 'text', inputmode: 'decimal', class: 'num', id: 'c-margine-voluto',
            value: String(valore).replace('.', ','),
            oninput: (e) => { margineVoluto = leggiNumero(e.target.value); aggiornaDerivati(); },
          })),
        h('div', { class: 'scelta-leva' },
          h('span', { class: 'et-livello', testo: 'Agendo su' }),
          h('div', { class: 'gruppo-bottoni' },
            ...Object.entries(LEVE).map(([k, et]) => h('button', {
              class: levaMargine === k ? 'selezionato' : '', testo: et,
              'aria-pressed': levaMargine === k ? 'true' : 'false',
              onclick: () => { levaMargine = k; disegna(); },
            }))))),
      h('p', { class: 'esito-margine', id: 'esito-margine', testo: '' }),
      h('div', { class: 'azioni' },
        h('button', { class: 'primario', testo: 'Applica lo scostamento', onclick: applica }),
        h('button', {
          testo: 'Azzera gli scostamenti',
          onclick: () => { sim.delta = { ricavo: 0, ricavoLinea: {}, globale: 0, linea: {}, catLinea: {}, voce: {} }; disegna(); },
        })),
      h('p', { class: 'nota', testo: 'Lo scostamento calcolato finisce nei cursori qui sotto: da lì lo puoi ritoccare, distribuire su un singolo servizio o annullare.' })));
}

function schedaSimulazione() {
  const globali = h('div', { class: 'cursori' },
    cursore('Tutti i costi', 'delta.globale', sim.delta.globale),
    cursore('Tutti i ricavi', 'delta.ricavo', sim.delta.ricavo));

  const perLinea = sim.linee.map((l) => h('section', { class: 'pannello' },
    h('h2', { testo: l.nome || 'Servizio' }),
    h('div', { class: 'corpo' },
      h('div', { class: 'cursori' },
        cursore('Ricavo del servizio', `delta.ricavoLinea.${l.id}`, sim.delta.ricavoLinea?.[l.id] ?? 0),
        cursore('Tutti i costi del servizio', `delta.linea.${l.id}`, sim.delta.linea?.[l.id] ?? 0),
        ...CATEGORIE.filter((c) => l.voci.some((v) => v.cat === c)).map((c) =>
          cursore(ETICHETTA_CATEGORIA[c], `delta.catLinea.${l.id}|${c}`, sim.delta.catLinea?.[`${l.id}|${c}`] ?? 0, `catsim:${l.id}:${c}`))))));

  return h('div', {},
    riepilogoSimulazione(),
    pannelloMargine(),
    h('section', { class: 'pannello' },
      h('h2', { testo: 'Scostamenti complessivi' }),
      h('div', { class: 'corpo' }, globali,
        h('p', { class: 'nota' }, 'Gli scostamenti si applicano alla colonna KOM e si compongono moltiplicativamente: complessivo, poi servizio, poi categoria. Il KOM non viene modificato.'),
        h('button', {
          style: 'margin-top:8px', testo: 'Azzera tutti gli scostamenti',
          onclick: () => { sim.delta = { ricavo: 0, ricavoLinea: {}, globale: 0, linea: {}, catLinea: {}, voce: {} }; disegna(); },
        }))),
    ...perLinea,
    h('section', { class: 'pannello' },
      h('h2', { testo: 'Dove conviene intervenire' }),
      h('div', { class: 'corpo' },
        h('div', { class: 'azioni', style: 'margin-bottom:8px;align-items:center' },
          h('span', { class: 'et-livello', testo: 'Dettaglio' }),
          ...[['voce', 'Per voce'], ['categoria', 'Per categoria']].map(([k, et]) => h('button', {
            class: livelloSensitivita === k ? 'selezionato' : '', testo: et,
            'aria-pressed': livelloSensitivita === k ? 'true' : 'false',
            onclick: () => { livelloSensitivita = k; disegna(); },
          }))),
        h('div', { id: 'tornado' }),
        h('p', { class: 'nota', testo: 'Effetto sul margine di una variazione di più o meno 10%, tenendo fermo tutto il resto. In cima c\u2019è la voce dove un punto guadagnato vale di più.' }))));
}

function schedaArchivio() {
  const modoArchivio = modo();
  const azioni = h('div', { class: 'azioni', style: 'margin-bottom:12px' },
    h('button', {
      class: 'primario', testo: 'Salva nell’archivio',
      onclick: async () => {
        try {
          const r = await salva(sim);
          await ricaricaArchivio();
          avvisa(`Salvata come ${r.nome}.`);
        } catch (e) { avvisa('Salvataggio non riuscito: ' + e.message); }
      },
    }),
    supportaCartella() ? h('button', {
      testo: modoArchivio === 'cartella' ? 'Cambia cartella' : 'Scegli la cartella di rete',
      onclick: async () => {
        try { await scegliCartella(); await ricaricaArchivio(); disegna(); avvisa('Cartella collegata.'); }
        catch (e) { if (e.name !== 'AbortError') avvisa('Cartella non collegata: ' + e.message); }
      },
    }) : null,
    h('button', {
      testo: 'Scarica come file',
      onclick: () => {
        if (incorporata()) offriTesto('Simulazione in formato JSON', nomeFile(sim), JSON.stringify(sim, null, 2));
        else scarica(sim);
      },
    }),
    h('button', {
      testo: 'Apri da file',
      onclick: async () => {
        try { sim = await apriFile(); disegna(); avvisa('Simulazione caricata.'); }
        catch (e) { avvisa(e.message); }
      },
    }),
    h('button', {
      testo: 'Nuova simulazione',
      onclick: () => {
        if (!confirm('Azzerare la simulazione corrente? Quello che non è stato salvato va perso.')) return;
        sim = nuovaSimulazione(); scheda = 'dati'; disegna(); avvisa('Nuova simulazione, maschera vuota.');
      },
    }));

  const elenco = h('div', { class: 'elenco-archivio' },
    elencoArchivio.length === 0
      ? h('div', { class: 'vuoto', testo: 'Nessuna simulazione in archivio.' })
      : elencoArchivio.map((v) => {
        const r = calcolaColonna(v.sim, 'simulato');
        return h('div', { class: 'voce-archivio' },
          h('div', { class: 'id' },
            h('b', { testo: `${v.codice}${v.cliente ? ' · ' + v.cliente : ''}` }),
            h('small', { testo: `${v.descrizione ? v.descrizione + ' · ' : ''}${v.nome}` })),
          h('div', { style: 'display:flex;gap:10px;align-items:center;flex-wrap:wrap' },
            h('span', { class: 'pillola ' + classeMargine(r.miPct, (v.sim.parametri?.targetPct || 0) / 100), testo: 'MI ' + perc(r.miPct) }),
            h('button', {
              testo: 'Apri',
              onclick: () => { sim = normalizza(JSON.parse(JSON.stringify(v.sim))); scheda = 'dati'; disegna(); avvisa('Aperta ' + v.nome + '. Salvando si crea una nuova voce, l’originale resta.'); },
            }),
            h('button', {
              class: 'muto', testo: 'Elimina',
              onclick: async () => {
                if (!confirm('Eliminare ' + v.nome + '?')) return;
                await elimina(v.nome); await ricaricaArchivio(); disegna();
              },
            })));
      }));

  const nota = modoArchivio === 'cartella'
    ? h('p', { class: 'nota', testo: 'Archivio su cartella di rete. I file restano anche se il browser viene ripulito, sono visibili da Esplora risorse e rientrano nel backup aziendale.' })
    : h('div', { class: 'avviso' }, h('span', {}, 'Archivio nella memoria di questo browser. È un ripiego: sparisce con la pulizia dei dati di navigazione e non è condiviso con gli altri PM. ' + (supportaCartella() ? 'Collega una cartella di rete per un archivio vero.' : 'Il collegamento a una cartella richiede Chrome o Edge su desktop; altrimenti usa Scarica come file.')));

  return h('div', {},
    h('section', { class: 'pannello' },
      h('h2', { testo: 'Archivio delle simulazioni' }),
      h('div', { class: 'corpo' },
        azioni, nota,
        h('p', { class: 'nota', testo: 'Ogni salvataggio crea una nuova voce datata. Niente si aggiorna nel tempo: una simulazione è una fotografia della data in cui è stata fatta.' }))),
    h('section', { class: 'pannello' }, h('h2', { testo: 'Simulazioni salvate' }), h('div', { class: 'corpo' }, elenco)));
}

async function ricaricaArchivio() {
  try { elencoArchivio = await elenca(); }
  catch { elencoArchivio = []; }
  if (scheda === 'archivio') disegna();
}
